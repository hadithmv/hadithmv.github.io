<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>DataTables CSV Example</title>
    <link rel="stylesheet" href="datatables.min.css" />
  </head>
  <body>
    <!-- Page Title from Metadata -->
    <div id="pageHeader" style="margin-bottom: 20px">
      <h1 id="pageTitle"></h1>
      <p id="pageSubtitle"></p>
    </div>

    <table id="table" class="display" style="width: 100%">
      <thead></thead>
      <tbody></tbody>
    </table>

    <script src="jquery-3.7.1.min.js"></script>
    <script src="datatables.min.js"></script>
    <script src="papaparse.min.js"></script>
    <script type="module">
      import { initializePageWithMetadata } from "../js/dbLookup.js";

      // Initialize page with metadata
      initializePageWithMetadata(function (metadata) {
        // Display metadata on page
        document.getElementById("pageTitle").textContent =
          metadata.titleEN || metadata.bookCode;
        document.getElementById("pageSubtitle").textContent =
          metadata.titleAR || "";

        // Load CSV data
        Papa.parse(metadata.csvPath, {
          download: true,
          header: false,
          dynamicTyping: true,
          complete: function (results) {
            const data = results.data.filter(
              (row) =>
                Array.isArray(row) &&
                row.some((value) => value !== null && value !== ""),
            );

            const maxCols = data.reduce(
              (max, row) => Math.max(max, row.length),
              0,
            );

            const columns = Array.from({ length: maxCols }, (_, idx) => ({
              title:
                idx === 0
                  ? "#"
                  : idx === maxCols - 1
                    ? "Notes"
                    : "Column " + (idx + 1),
              data: idx,
              defaultContent: "",
            }));

            new DataTable("#table", {
              data: data,
              columns: columns,
              paging: true,
              searching: true,
              ordering: true,
            });
          },
        });
      });
    </script>
  </body>
</html>
