<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title></title>
    <link rel="stylesheet" href="datatables.min.css" />
    <style>
      #tableWrapper {
        display: flex;
        justify-content: flex-end;
        align-items: flex-start;
        width: 100%;
      }

      #tableWrapper table {
        width: auto;
        max-width: 100%;
        direction: rtl;
        text-align: right;
        vertical-align: top;
      }

      #tableWrapper table.dataTable th,
      #tableWrapper table.dataTable td {
        vertical-align: top !important;
      }

      #pageHeader {
        margin-bottom: 20px;
        padding: 20px;
        border-bottom: 2px solid #ddd;
      }

      #pageHeader h1 {
        margin: 0 0 10px 0;
      }

      #pageHeader p {
        margin: 0;
        color: #666;
      }

      .loading {
        text-align: center;
        padding: 40px;
        color: #999;
      }

      .error {
        color: #d32f2f;
        padding: 20px;
        background-color: #ffebee;
        border-radius: 4px;
        margin: 20px;
      }
    </style>
  </head>
  <body>
    <!-- Page Header with Metadata -->
    <div id="pageHeader" style="display: none">
      <h1 id="pageTitle"></h1>
      <p id="pageSubtitle"></p>
      <p id="pageSubsubtitle"></p>
    </div>

    <!-- Loading State -->
    <div id="loadingMessage" class="loading">Loading book data...</div>

    <!-- Error State -->
    <div id="errorMessage" class="error" style="display: none"></div>

    <!-- Table Container -->
    <div id="tableWrapper" style="display: none">
      <table id="table" class="display" style="width: auto">
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>

    <script src="jquery-3.7.1.min.js"></script>
    <script src="datatables.min.js"></script>
    <script src="papaparse.min.js"></script>

    <script type="module">
      import { initializePageWithMetadata } from "../js/dbLookup.js";

      // Initialize page with metadata and CSV
      initializePageWithMetadata(async function (metadata) {
        // Set page title
        document.title = metadata.titleEN || metadata.bookCode;

        // Display metadata on page
        document.getElementById("pageTitle").textContent =
          metadata.titleEN || metadata.bookCode;
        document.getElementById("pageSubtitle").textContent =
          metadata.titleAR || "";
        document.getElementById("pageSubsubtitle").textContent =
          metadata.titleDV || "";
        document.getElementById("pageHeader").style.display = "block";

        // Load CSV data
        Papa.parse(metadata.csvPath, {
          download: true,
          header: false,
          dynamicTyping: true,
          complete: function (results) {
            const data = results.data.filter(
              (row) =>
                Array.isArray(row) &&
                row.some((value) => value !== null && value !== ""),
            );

            if (data.length === 0) {
              showError("No data found in CSV file: " + metadata.csvPath);
              return;
            }

            const maxCols = data.reduce(
              (max, row) => Math.max(max, row.length),
              0,
            );

            const columns = Array.from({ length: maxCols }, (_, idx) => ({
              title:
                idx === 0
                  ? "#"
                  : idx === maxCols - 1
                    ? "Notes"
                    : "Column " + (idx + 1),
              data: idx,
              defaultContent: "",
            }));

            // Hide loading, show table
            document.getElementById("loadingMessage").style.display = "none";
            document.getElementById("tableWrapper").style.display = "flex";

            // Initialize DataTable
            $("#table").DataTable({
              data: data,
              columns: columns,
              deferRender: true,
              pageLength: 10,
              responsive: true,
              destroy: true,
            });
          },
          error: function (err) {
            showError("Error loading CSV: " + err);
          },
        });
      });

      function showError(message) {
        document.getElementById("loadingMessage").style.display = "none";
        document.getElementById("errorMessage").textContent = message;
        document.getElementById("errorMessage").style.display = "block";
        console.error(message);
      }
    </script>
  </body>
</html>
