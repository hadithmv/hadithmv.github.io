<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search</title>
    <link rel="stylesheet" href="../css/common.css" />
    <!-- reader-search.css: shared with the reader page — supplies the
         search-history dropdown styles (.search-results + .search-history-*) -->
    <link rel="stylesheet" href="../css/reader-search.css" />
    <link rel="stylesheet" href="../css/library-search.css" />
    <!-- search-window.css: shared with the reader page — the unified search
         window shell + the scope picker's surface rules (the libScope modal
         keeps only its page geometry in library-search.css) -->
    <link rel="stylesheet" href="../css/search-window.css" />
    <script>
      (function () {
        var t = localStorage.getItem("theme");
        if (t && t !== "light")
          document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
  </head>

  <body>
    <div id="topBar">
      <button
        id="backToDashboard"
        title="Back to book list (Ctrl+B)"
        onclick="window.location.href = 'index.html'"
      >
        ↩
      </button>
      <button
        id="btnFocus"
        class="nav-focus-btn"
        title="Toggle focus reading mode (Alt+Z)"
        style="display: none"
      >
        ▾
      </button>
      <span id="topBarBrand">ހަދީޘްއެމްވީ</span>
      <h1 id="pageTitle" style="display: none"></h1>
      <button id="menuBtn" class="menu-btn" title="Menu (Escape to close)">
        ☰
      </button>
    </div>

    <!-- Sidebar overlay -->
    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <h2 class="sidebar-title" data-i18n="sidebarTitle">Hadithmv</h2>
        <button
          id="sidebarClose"
          class="sidebar-close"
          title="Close (Escape key)"
        >
          ✕
        </button>
      </div>

      <nav class="sidebar-nav">
        <a
          href="index.html"
          class="sidebar-link"
          data-i18n="navDashboard"
          title="Back to the book list"
          >← ފޮތްތަކުގެ ލިސްޓް</a
        >
        <a
          href="library-search.html"
          class="sidebar-link"
          data-i18n="searchBooks"
          title="Search inside all books"
          >🔎 ފޮތްތަކުގައި ހޯދާ</a
        >
        <button
          id="sidebarPins"
          type="button"
          class="sidebar-link"
          title="Open pinned books"
          aria-haspopup="dialog"
        >
          📌 ޕިންތައް
        </button>
        <button
          id="sidebarHistory"
          type="button"
          class="sidebar-link"
          title="Open reading history"
          aria-haspopup="dialog"
        >
          🕐 ހިސްޓަރީ
        </button>
      </nav>

      <div class="sidebar-divider"></div>

      <nav class="sidebar-nav">
        <a
          href="https://github.com/hadithmv/hadithmv.github.io"
          target="_blank"
          rel="noopener"
          class="sidebar-link"
          data-i18n="navGitHub"
          title="GitHub source"
          >🐙 GitHub</a
        >
        <a
          href="faq.html"
          class="sidebar-link"
          data-i18n="navFaq"
          title="Frequently asked questions"
          >❓ FAQ</a
        >
        <a
          href="help.html"
          class="sidebar-link"
          data-i18n="navHelp"
          title="Help"
          >🛟 އެހީ</a
        >
        <a
          href="contact.html"
          class="sidebar-link"
          data-i18n="navContact"
          title="Contact"
          >📧 ގުޅުން</a
        >
      </nav>

      <div class="sidebar-divider"></div>

      <button
        id="btnSettings"
        type="button"
        class="sidebar-link"
        title="Open settings (Ctrl+,)"
      >
        <span>⚙</span>
        <span data-i18n="labelSettings">ސެޓިންގްސް</span>
      </button>

      <button
        id="btnScrollTop"
        type="button"
        class="sidebar-link"
        data-i18n="navScrollTop"
        title="Scroll to top"
      >
        ⬆ މައްޗަށް
      </button>

      <div class="sidebar-footer">
        <div class="sidebar-version" data-i18n="appVersion">
          ވާޝަން 6.9.85 · ވެބް
        </div>
        <div class="sidebar-credit" data-i18n="appCredit">
          ހަދާފައިވަނީ: hadithmv
        </div>
      </div>
    </aside>

    <div id="settingsOverlay" class="modal-overlay">
      <div id="settingsModal" class="modal" role="dialog">
        <div class="modal-header">
          <h2 class="modal-title" data-i18n="labelSettings">ސެޓިންގްސް</h2>
          <button
            id="btnResetSettings"
            class="modal-reset-small"
            data-i18n="btnReset"
            title="Reset all settings"
          >
            ↺ ރީސެޓް
          </button>
          <button
            id="settingsModalClose"
            class="modal-close"
            title="Close (Escape key)"
          >
            ✕
          </button>
        </div>
        <div class="modal-body">
          <div class="modal-row">
            <span class="modal-label" data-i18n="labelTheme">ތީމް</span>
            <select id="selTheme" class="modal-select">
              <option value="light">☀️ އަލި</option>
              <option value="dark">🌙 އަނދިރި</option>
              <option value="sepia">📜 ސީޕިއާ</option>
            </select>
          </div>
          <div class="modal-row">
            <span class="modal-label" data-i18n="labelWidth">ފުޅާމިން</span>
            <select id="selWidth" class="modal-select">
              <option value="600px">600px</option>
              <option value="800px" selected>800px</option>
              <option value="1000px">1000px</option>
              <option value="1200px">1200px</option>
              <option value="none" data-i18n="labelWidthFull">
                ފުލް ސްކްރީން
              </option>
            </select>
          </div>
          <div class="modal-row">
            <span class="modal-label" data-i18n="settingsLanguage">ބަސް</span>
            <select
              id="selLanguage"
              class="modal-select"
              title="Change language"
            >
              <option value="dv">ދިވެހި</option>
              <option value="en">English</option>
              <option value="ar">العربية</option>
            </select>
          </div>
          <div class="modal-row">
            <span class="modal-label" data-i18n="settingsFont">ފޮންޓް</span>
            <button
              id="btnOpenFontModal"
              class="modal-select"
              data-i18n="btnOpenFontText"
            >
              ބަދަލުކުރޭ
            </button>
          </div>
        </div>
      </div>
    </div>

    <div id="fontModalOverlay" class="modal-overlay">
      <div id="fontModal" class="modal font-modal" role="dialog">
        <div class="modal-header">
          <h2 class="modal-title" data-i18n="settingsFont">ފޮންޓް</h2>
          <button
            id="btnResetFont"
            class="modal-reset-small"
            data-i18n="btnReset"
            title="Reset font to defaults"
          >
            ↺ ރީސެޓް
          </button>
          <button
            id="fontModalClose"
            class="modal-close"
            title="Close (Escape key)"
          >
            ✕
          </button>
        </div>
        <div class="modal-body">
          <div class="modal-row">
            <span data-i18n="labelFontSize">ފޮންޓް ސައިޒު</span>
            <div class="font-size-row">
              <button
                id="btnFontDown"
                class="font-adjust-button"
                title="Decrease font size"
              >
                −
              </button>
              <span id="fontSizeVal" class="font-size-val">1.25rem</span>
              <button
                id="btnFontUp"
                class="font-adjust-button"
                title="Increase font size"
              >
                +
              </button>
            </div>
          </div>
          <div class="modal-row">
            <span data-i18n="labelFontFamily">ފޮންޓް ވައްތަރު</span>
            <select id="selFontFamily" class="font-select" style="width: auto">
              <option value="hadithmv" data-i18n="fontHadithmv">
                Hadithmv Font
              </option>
              <option value="system" data-i18n="fontSystem">System Font</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <!-- Library search (cross-book) -->
    <div id="libWrapper">
      <!-- Sticky wrapper — search + tag chips stay pinned below the topbar -->
      <div id="libPanel" class="sticky-panel">
        <div id="libSearchPanel">
          <!-- The unified search window opens first on the row (the reader
               toolbar leads with the same button) — the page input follows -->
          <button
            type="button"
            id="btnSearchWindow"
            class="toolbar-btn"
            data-i18n="searchBtnLabel"
            title="Open search window"
          >
            🔍 ސާޗު
          </button>
          <div class="search-input-wrap">
            <input
              id="libSearchInput"
              type="search"
              class="search-input"
              data-i18n="libSearchPlaceholder"
              placeholder="ގިނަ ފޮތްތަކުން އެއްފަހަރާ ހޯދާ..."
              dir="rtl"
              autocomplete="off"
              title="Search inside all books (/ or Ctrl+F)"
            />
            <button
              type="button"
              id="libSearchClear"
              class="search-clear-btn"
              title="Clear search"
              aria-label="Clear search"
            >
              ✕
            </button>
          </div>
          <div
            id="searchHistoryDropdown"
            class="search-results search-history-dropdown"
            style="display: none"
          ></div>
          <button
            type="button"
            id="libScopeBtn"
            class="toolbar-btn lib-scope-btn"
            title="Choose which books to search"
            aria-haspopup="dialog"
          >
            All books ▾
          </button>
          <button
            type="button"
            id="libAuthorsBtn"
            class="toolbar-btn"
            data-i18n="libAuthors"
            title="Browse by author (Alt+A)"
            aria-haspopup="dialog"
          >
            Authors
          </button>
          <button
            type="button"
            id="libPeriodsBtn"
            class="toolbar-btn"
            data-i18n="libPeriods"
            title="Browse by period (Alt+R)"
            aria-haspopup="dialog"
          >
            Periods
          </button>
        </div>
        <div id="libTagsRow">
          <div id="libTagsCollapse" class="tags-collapse"></div>
          <button
            id="libTagsToggle"
            class="tags-toggle"
            type="button"
            title="More tags"
            style="display: none"
          >
            <span class="tags-toggle-arrow">▾</span>
            <span class="tags-toggle-label" data-i18n="tagsShowMore"
              >More tags</span
            >
          </button>
        </div>
      </div>
      <div id="libResultCount" class="search-info" dir="auto"></div>
      <div id="libResults" class="lib-results"></div>
    </div>

    <script type="module" src="../js/common.js"></script>
    <script type="module" src="../js/library-search-page.js"></script>
  </body>
</html>
