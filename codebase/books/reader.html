<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <!-- ⚠ CSS LOAD ORDER MATTERS: reader.css MUST be last because its mobile
         media queries need to override specificity ties with reader-quran.css.
         Reordering these <link> tags will break Quran nav sizing on mobile. -->
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/reader-quran.css" />
    <link rel="stylesheet" href="../css/reader-search.css" />
    <link rel="stylesheet" href="../css/reader-table-view.css" />
    <link rel="stylesheet" href="../css/search-window.css" />
    <link rel="stylesheet" href="../css/reader.css" />
    <script>
      (function () {
        var t = localStorage.getItem("theme");
        if (t && t !== "light")
          document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
  </head>

  <body>
    <div id="topBar">
      <button
        id="backToDashboard"
        title="Back to book list (Ctrl+B)"
        onclick="window.location.href = 'index.html'"
      >
        ↩
      </button>
      <button
        id="btnFocus"
        class="nav-focus-btn"
        title="Toggle focus reading mode (Alt+Z)"
      >
        ▾
      </button>
      <span
        id="topBarBrand"
        style="
          position: absolute;
          left: 50%;
          transform: translateX(-50%);
          pointer-events: none;
        "
        ><span
          class="skeleton-line"
          style="
            display: block;
            width: 130px;
            height: 1rem;
            vertical-align: middle;
          "
        ></span
      ></span>
      <h1 id="pageTitle"></h1>
      <button id="menuBtn" class="menu-btn" title="Menu (Escape to close)">
        ☰
      </button>
      <div id="readerProgressBar"><div id="readerProgressFill"></div></div>
    </div>

    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <h2 class="sidebar-title" data-i18n="sidebarTitle">Hadithmv</h2>
        <button
          id="sidebarClose"
          class="sidebar-close"
          title="Close (Escape key)"
        >
          ✕
        </button>
      </div>
      <nav class="sidebar-nav">
        <a
          href="index.html"
          class="sidebar-link"
          data-i18n="navDashboard"
          title="Back to the book list"
          >← ފޮތްތަކުގެ ލިސްޓް</a
        >
        <a
          href="library-search.html"
          class="sidebar-link"
          data-i18n="searchBooks"
          title="Search inside all books"
          >🔎 ފޮތްތަކުގައި ހޯދާ</a
        >
        <button
          id="sidebarPins"
          type="button"
          class="sidebar-link"
          title="Open pinned books"
          aria-haspopup="dialog"
        >
          📌 ޕިންތައް
        </button>
        <button
          id="sidebarHistory"
          type="button"
          class="sidebar-link"
          title="Open reading history"
          aria-haspopup="dialog"
        >
          🕐 ހިސްޓަރީ
        </button>
      </nav>
      <div class="sidebar-divider"></div>
      <nav class="sidebar-nav">
        <a
          href="https://github.com/hadithmv/hadithmv.github.io"
          target="_blank"
          rel="noopener"
          class="sidebar-link"
          data-i18n="navGitHub"
          title="GitHub source"
          >🐙 GitHub</a
        >
        <a
          href="faq.html"
          class="sidebar-link"
          data-i18n="navFaq"
          title="Frequently asked questions"
          >❓ FAQ</a
        >
        <a
          href="help.html"
          class="sidebar-link"
          data-i18n="navHelp"
          title="Help"
          >🛟 އެހީ</a
        >
        <a
          href="contact.html"
          class="sidebar-link"
          data-i18n="navContact"
          title="Contact"
          >📧 ގުޅުން</a
        >
      </nav>
      <div class="sidebar-divider"></div>
      <button
        id="btnSettings"
        type="button"
        class="sidebar-link"
        title="Open settings (Ctrl+,)"
      >
        <span>⚙</span> <span data-i18n="labelSettings">ސެޓިންގްސް</span>
      </button>
      <button
        id="btnScrollTop"
        type="button"
        class="sidebar-link"
        data-i18n="navScrollTop"
        title="Scroll to top"
      >
        ⬆ މައްޗަށް
      </button>
      <div class="sidebar-footer">
        <div class="sidebar-version" data-i18n="appVersion">
          ވާޝަން 6.9.85 · ވެބް
        </div>
        <div class="sidebar-credit" data-i18n="appCredit">
          ހަދާފައިވަނީ: hadithmv
        </div>
      </div>
    </aside>

    <div id="settingsOverlay" class="modal-overlay">
      <div id="settingsModal" class="modal" role="dialog">
        <div class="modal-header">
          <h2 class="modal-title" data-i18n="labelSettings">ސެޓިންގްސް</h2>
          <button
            id="btnResetSettings"
            class="modal-reset-small"
            data-i18n="btnReset"
            title="Reset all settings"
          >
            ↺ ރީސެޓް
          </button>
          <button
            id="settingsModalClose"
            class="modal-close"
            title="Close (Escape key)"
          >
            ✕
          </button>
        </div>
        <div class="modal-body">
          <div class="modal-row">
            <span class="modal-label" data-i18n="labelTheme">ތީމް</span>
            <select id="selTheme" class="modal-select">
              <option value="light">☀️ އަލި</option>
              <option value="dark">🌙 އަނދިރި</option>
              <option value="sepia">📜 ސީޕިއާ</option>
            </select>
          </div>
          <div class="modal-row">
            <span class="modal-label" data-i18n="labelWidth">ފުޅާމިން</span>
            <select id="selWidth" class="modal-select">
              <option value="600px">600px</option>
              <option value="800px" selected>800px</option>
              <option value="1000px">1000px</option>
              <option value="1200px">1200px</option>
              <option value="none" data-i18n="labelWidthFull">
                ފުލް ސްކްރީން
              </option>
            </select>
          </div>
          <div class="modal-row">
            <span class="modal-label" data-i18n="settingsLanguage">ބަސް</span>
            <select
              id="selLanguage"
              class="modal-select"
              title="Change language"
            >
              <option value="dv">ދިވެހި</option>
              <option value="en">English</option>
              <option value="ar">العربية</option>
            </select>
          </div>
          <div class="modal-row">
            <span class="modal-label" data-i18n="settingsFont">ފޮންޓް</span>
            <button
              id="btnOpenFontModal"
              class="modal-select"
              data-i18n="btnOpenFontText"
            >
              ބަދަލުކުރޭ
            </button>
          </div>
        </div>
      </div>
    </div>

    <div id="fontModalOverlay" class="modal-overlay">
      <div id="fontModal" class="modal font-modal" role="dialog">
        <div class="modal-header">
          <h2 class="modal-title" data-i18n="settingsFont">ފޮންޓް</h2>
          <button
            id="btnResetFont"
            class="modal-reset-small"
            data-i18n="btnReset"
            title="Reset font to defaults"
          >
            ↺ ރީސެޓް
          </button>
          <button
            id="fontModalClose"
            class="modal-close"
            title="Close (Escape key)"
          >
            ✕
          </button>
        </div>
        <div class="modal-body">
          <div class="modal-row">
            <span data-i18n="labelFontSize">ފޮންޓް ސައިޒު</span>
            <div class="font-size-row">
              <button
                id="btnFontDown"
                class="font-adjust-button"
                title="Decrease font size"
              >
                −
              </button>
              <span id="fontSizeVal" class="font-size-val">1.25rem</span>
              <button
                id="btnFontUp"
                class="font-adjust-button"
                title="Increase font size"
              >
                +
              </button>
            </div>
          </div>
          <div class="modal-row">
            <span data-i18n="labelFontFamily">ފޮންޓް ވައްތަރު</span>
            <select id="selFontFamily" class="font-select" style="width: auto">
              <option value="hadithmv" data-i18n="fontHadithmv">
                Hadithmv Font
              </option>
              <option value="system" data-i18n="fontSystem">System Font</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <div id="loadingMessage" class="skeleton" dir="rtl">
      <div class="skeleton-line"></div>
      <div class="skeleton-line"></div>
      <div class="skeleton-line"></div>
      <div class="skeleton-line"></div>
      <div class="skeleton-line"></div>
      <div class="skeleton-line"></div>
      <div class="skeleton-line"></div>
      <div class="skeleton-line"></div>
      <div class="skeleton-line"></div>
      <div class="skeleton-line"></div>
      <div class="skeleton-line"></div>
      <div class="skeleton-line"></div>
      <div class="skeleton-line"></div>
      <div class="skeleton-line"></div>
      <div class="skeleton-line"></div>
    </div>
    <div id="errorMessage" class="error" style="display: none"></div>

    <div id="readerWrapper" style="display: none">
      <div id="readerPageHeader" style="display: none"></div>
      <div
        id="columnDropdown"
        class="column-dropdown"
        style="display: none; position: absolute; z-index: 60"
      >
        <div id="columnToggles" class="column-toggles"></div>
      </div>
      <div
        id="exportDropdown"
        class="export-dropdown"
        style="display: none; position: absolute; z-index: 60"
      >
        <button
          class="export-option dd-item"
          data-format="txt"
          title="Plain text"
        >
          TXT
        </button>
        <button
          class="export-option dd-item"
          data-format="word"
          title="Word document"
        >
          Word
        </button>
        <button
          class="export-option dd-item"
          data-format="pdf"
          title="PDF for printing"
        >
          PDF
        </button>
        <button
          class="export-option dd-item"
          data-format="png"
          title="PNG screenshot of current page"
        >
          Image
        </button>
        <button
          class="export-option dd-item"
          data-format="epub"
          title="EPUB e-book"
        >
          EPUB
        </button>
        <button class="export-option dd-item" data-format="md" title="Markdown">
          MD
        </button>
        <button
          class="export-option dd-item"
          data-format="json"
          title="JSON data"
        >
          JSON
        </button>
        <button
          class="export-option dd-item"
          data-format="csv"
          title="Comma-separated values"
        >
          CSV
        </button>
        <button
          class="export-option dd-item"
          data-format="tsv"
          title="Tab-separated values"
        >
          TSV
        </button>
        <button
          class="export-option dd-item"
          data-format="excel"
          title="Excel spreadsheet"
        >
          Excel
        </button>
        <button
          class="export-option dd-item"
          data-format="html"
          title="HTML web page"
        >
          HTML Book
        </button>
        <button
          class="export-option dd-item"
          data-format="html-table"
          title="HTML table with all columns"
        >
          HTML Table
        </button>
        <button
          class="export-option dd-item"
          data-format="yaml"
          title="YAML data"
        >
          YAML
        </button>
        <button
          class="export-option dd-item"
          data-format="toon"
          title="TOON compact notation"
        >
          TOON
        </button>
        <button
          class="export-option dd-item"
          data-format="xml"
          title="XML structured data"
        >
          XML
        </button>
      </div>
      <!-- Reader chrome — split like the dashboard for a shared structure:
           the shell #readerPanel holds the search row (the RDF in-place
           filter) + the collapsible #collapsibleReaderPanel (toolbar,
           pagination, Quran nav). Unlike the dashboard, reader focus
           hides everything. -->
      <div id="readerPanel" class="sticky-panel">
        <div id="readerPanelSearch" class="reader-panel-row">
          <!-- In-place filter — RDF dictionary books only (the whole row is
               hidden by JS for every other book; the window button leads
               the toolbar below). -->
          <div class="search-input-wrap" id="readerSearchWrap">
            <input
              id="readerSearchInput"
              type="search"
              class="search-input"
              title="Search (/ or Ctrl+F. * wildcard, ? char, -exclude, ~fuzzy~, .wholeword, /regex/)"
              data-i18n="searchPlaceholder"
              placeholder="މި ފޮތުން ހޯދާ…"
              dir="rtl"
              autocomplete="off"
            />
            <button
              type="button"
              id="readerSearchClear"
              class="search-clear-btn"
              title="Clear search"
              aria-label="Clear search"
            >
              ✕
            </button>
          </div>
        </div>
        <!-- Collapsible toolbar — functions, pagination and Quran nav.
               Focus collapses this (grid 0fr — needs exactly one child, the
               inner) and also hides the search row above. -->
        <div id="collapsibleReaderPanel">
          <div class="reader-panel-inner">
            <div
              id="readerPanelFunctions"
              class="reader-panel-row reader-toolbar"
              dir="rtl"
            >
              <!-- The unified search window leads the toolbar row (the
                   library page row leads with the same button). -->
              <button
                id="btnSearchWindow"
                class="toolbar-btn"
                data-i18n="searchBtnLabel"
                title="Search (Ctrl+F or /)"
              >
                🔍 ސާޗު
              </button>
              <div class="toolbar-group">
                <button
                  id="btnCopy"
                  class="toolbar-btn"
                  title="Copy current page to clipboard"
                  data-i18n="btnCopyText"
                >
                  📋 ކޮޕީ ކުރޭ
                </button>
                <button
                  id="btnTashkeel"
                  class="toolbar-btn"
                  title="Toggle Arabic diacritics (Alt+T)"
                  data-i18n="btnTashkeelText"
                >
                  ◉ ފިލި ފޮރުވާ
                </button>
                <button
                  id="btnShare"
                  class="toolbar-btn"
                  title="Share link to current position (Alt+S)"
                  data-i18n="btnShareText"
                >
                  🔗 ޝެއަރ
                </button>
                <button
                  id="btnBookmark"
                  class="toolbar-btn"
                  title="Bookmark current page (Alt+P)"
                  data-i18n="btnBookmarkText"
                >
                  📌 ޕިން
                </button>
                <div
                  class="toolbar-group"
                  style="position: relative"
                  id="viewModeGroup"
                >
                  <button
                    id="btnViewMode"
                    class="toolbar-btn"
                    title="Change view mode (Alt+V)"
                  >
                    📖 ފެންނަ ގޮތް ▾
                  </button>
                  <div
                    id="viewModeDropdown"
                    class="view-mode-dropdown dd-menu"
                    style="display: none"
                  >
                    <label data-mode="card" class="view-mode-option dd-item"
                      ><input type="checkbox" data-mode="card" /> ކާޑް 📄</label
                    >
                    <label data-mode="table" class="view-mode-option dd-item"
                      ><input type="checkbox" data-mode="table" /> ޓޭބަލް
                      ▦</label
                    >
                    <label data-mode="parallel" class="view-mode-option dd-item"
                      ><input type="checkbox" data-mode="parallel" /> ދެފަރާތް
                      ↔️</label
                    >
                  </div>
                </div>
                <button
                  id="btnResetReader"
                  class="toolbar-btn"
                  title="Reset view: show all columns, clear search, exit focus"
                  data-i18n="btnReset"
                >
                  ↺ ރީސެޓް
                </button>
                <div class="toolbar-group" style="position: relative">
                  <button
                    id="btnExport"
                    class="toolbar-btn"
                    title="Export book in various formats (Alt+E)"
                    data-i18n="btnExportText"
                  >
                    📥 އެކްސްޕޯޓް
                  </button>
                </div>
                <div
                  id="columnTogglesGroup"
                  style="display: none; position: relative"
                >
                  <button
                    id="btnColumnDropdown"
                    class="toolbar-btn"
                    title="Show/hide columns"
                    data-i18n="labelColumns"
                  >
                    ކޮލަމް ފޮރުވާ ▾
                  </button>
                </div>
              </div>
            </div>
            <nav
              id="readerPanelPagination"
              class="reader-panel-row reader-nav"
              dir="rtl"
            >
              <div class="nav-pages">
                <button
                  id="btnFirst"
                  class="nav-btn nav-edge"
                  title="First page (Home key)"
                >
                  <<
                </button>
                <button
                  id="btnPrev"
                  class="nav-btn"
                  title="Previous page (→ arrow key)"
                >
                  &lt;
                </button>
                <span id="readerPageNumbers" class="page-numbers"></span>
                <button
                  id="btnNext"
                  class="nav-btn"
                  title="Next page (← arrow key)"
                >
                  &gt;
                </button>
                <button
                  id="btnLast"
                  class="nav-btn nav-edge"
                  title="Last page (End key)"
                >
                  &gt;&gt;
                </button>
              </div>
              <span id="readerPageSubRow" style="display: none"
                ><span id="readerPageSubtitle"></span
                ><span id="readerPageAuthor"></span
                ><span id="readerPageTags"></span
              ></span>
            </nav>
            <!-- Quran navigation row (hidden for non-Quran books) -->
            <div
              id="readerPanelQuran"
              class="reader-panel-row quran-nav"
              dir="rtl"
              style="display: none"
            >
              <div class="quran-nav-group">
                <span class="quran-nav-label" data-i18n="qrnSurah"
                  >ސޫރަތް:</span
                >
                <button
                  id="qrnSurahPrev"
                  class="toolbar-btn quran-nav-arrow"
                  title="Previous surah"
                >
                  ▶
                </button>
                <button
                  id="qrnSurahBtn"
                  class="toolbar-btn quran-nav-box"
                  title="Select surah"
                >
                  <span id="qrnSurahLabel">1 الفَاتِحَة</span>
                </button>
                <button
                  id="qrnSurahNext"
                  class="toolbar-btn quran-nav-arrow"
                  title="Next surah"
                >
                  ◀
                </button>
              </div>
              <div class="quran-nav-group">
                <span class="quran-nav-label" data-i18n="qrnAyah">އާޔަތް:</span>
                <button
                  id="qrnAyahPrev"
                  class="toolbar-btn quran-nav-arrow"
                  title="Previous ayah"
                >
                  ▶
                </button>
                <input
                  id="qrnAyahInput"
                  type="number"
                  class="quran-nav-input"
                  min="1"
                  max="7"
                  value="1"
                  title="Ayah number"
                  autocomplete="off"
                />
                <button
                  id="qrnAyahNext"
                  class="toolbar-btn quran-nav-arrow"
                  title="Next ayah"
                >
                  ◀
                </button>
              </div>
              <div class="quran-nav-group">
                <span class="quran-nav-label" data-i18n="qrnJuz">ޖުޒް:</span>
                <button
                  id="qrnJuzPrev"
                  class="toolbar-btn quran-nav-arrow"
                  title="Previous juz"
                >
                  ▶
                </button>
                <input
                  id="qrnJuzInput"
                  type="number"
                  class="quran-nav-input"
                  min="1"
                  max="30"
                  value="1"
                  title="Juz number"
                  autocomplete="off"
                />
                <button
                  id="qrnJuzNext"
                  class="toolbar-btn quran-nav-arrow"
                  title="Next juz"
                >
                  ◀
                </button>
              </div>
              <div class="quran-nav-group">
                <button
                  id="qrnContentBtn"
                  class="toolbar-btn"
                  title="Manage columns"
                  data-i18n="qrnContent"
                >
                  ގުރްއާން ފޮތްތައް
                </button>
              </div>
              <div class="quran-nav-group" style="position: relative">
                <button
                  id="qrnDisplayBtn"
                  class="toolbar-btn"
                  title="Display options"
                >
                  ﴿١﴾ ▾
                </button>
                <div
                  id="qrnDisplayDropdown"
                  class="quran-content-dropdown dd-menu"
                  style="
                    display: none;
                    position: absolute;
                    left: 0;
                    min-width: 200px;
                  "
                >
                  <label class="quran-content-item dd-item">
                    <input type="checkbox" id="qrnToggleBraces" checked /><span
                      >﴿ ﴾ ބްރެކެޓް</span
                    >
                  </label>
                  <label class="quran-content-item dd-item">
                    <input type="checkbox" id="qrnToggleAyahNum" checked /><span
                      >١٢٣ އާޔަތް ނަންބަރު</span
                    >
                  </label>
                  <label
                    class="quran-content-item dd-item"
                    id="qrnNumberBracketsRow"
                  >
                    <input type="checkbox" id="qrnToggleNumberBrackets" /><span
                      >﴿١٢٣﴾ ނަންބަރު ބްރެކެޓްތެރޭ</span
                    >
                  </label>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div
          id="qrnSurahOverlay"
          class="quran-surah-overlay"
          style="display: none"
        >
          <div class="quran-surah-selector" dir="rtl">
            <div class="quran-surah-header">
              <input
                id="qrnSurahSearch"
                type="search"
                class="quran-surah-search"
                placeholder="ސޫރަތް ހޯދާ…"
                dir="rtl"
                autocomplete="off"
              />
              <button id="qrnSurahClose" class="modal-close" title="Close">
                ✕
              </button>
            </div>
            <div id="qrnSurahList" class="quran-surah-list"></div>
          </div>
        </div>
      </div>
      <article id="readerContent" dir="rtl"></article>
    </div>

    <script type="module" src="../js/common.js"></script>
    <script type="module" src="../js/search-window.js"></script>
    <script type="module" src="../js/reader.js"></script>
    <div id="scrollCounter" class="scroll-counter"></div>
    <script>
      (function () {
        var SCROLL_AMOUNT = 100;
        function hasOverflow(el) {
          return el.scrollWidth > el.clientWidth + 1;
        }
        function isRTL(el) {
          return getComputedStyle(el).direction === "rtl";
        }

        // The row (toolbar/nav) is the scrollable element. The wrap just holds
        // absolutely-positioned arrows in its padding area.
        //
        // scrollLeft:  0 = at start,  mx = at end.  Increases toward end.
        function updateArrows(wrap) {
          if (!wrap) return;
          var row = wrap._row;
          if (!row || !hasOverflow(row)) {
            wrap._arrowStart.classList.add("hidden");
            wrap._arrowEnd.classList.add("hidden");
            return;
          }
          // scrollLeft:  0 = logical start,  -mx = logical end  (negative range in RTL)
          // Decreasing (-delta) → toward end.  Increasing (+delta) → toward start.
          var mx = row.scrollWidth - row.clientWidth;
          var atStart = row.scrollLeft > -1; // near 0 = at logical start
          var atEnd = row.scrollLeft < -mx + 1; // near -mx = at logical end
          wrap._arrowStart.classList.toggle("hidden", atStart);
          wrap._arrowEnd.classList.toggle("hidden", atEnd || mx < 1);
        }

        function scrollRow(row, delta) {
          var start = row.scrollLeft,
            target = start + delta;
          var duration = 300,
            t0 = performance.now();
          function easeOutCubic(t) {
            return 1 - Math.pow(1 - t, 3);
          }
          (function step(now) {
            var p = Math.min(1, (now - t0) / duration);
            row.scrollLeft = start + delta * easeOutCubic(p);
            updateArrows(row.closest(".horizontal-scroll-wrap"));
            if (p < 1) requestAnimationFrame(step);
          })(t0);
        }

        // Wrap toolbar & nav rows — DOM ops work even in hidden subtrees.
        document.querySelectorAll(".reader-panel-row").forEach(function (row) {
          var rtl = isRTL(row),
            wrap = document.createElement("div");
          wrap.className = "horizontal-scroll-wrap";
          if (rtl) wrap.dir = "rtl";
          var b1 = document.createElement("button"),
            b2 = document.createElement("button");
          b1.className = "scroll-arrow scroll-arrow-start";
          b1.innerHTML = rtl ? "&#9654;" : "&#9664;";
          b2.className = "scroll-arrow scroll-arrow-end";
          b2.innerHTML = rtl ? "&#9664;" : "&#9654;";
          // Store refs directly on the wrap so updateArrows never queries wrong element
          wrap._row = row;
          wrap._arrowStart = b1;
          wrap._arrowEnd = b2;
          row.parentNode.insertBefore(wrap, row);
          wrap.appendChild(b1);
          wrap.appendChild(row);
          wrap.appendChild(b2);
          // b1 (start arrow, ▶ in RTL): scroll toward start → +delta.
          // b2 (end   arrow, ◀ in RTL): scroll toward end   → -delta.
          b1.addEventListener("click", function () {
            scrollRow(row, SCROLL_AMOUNT);
          });
          b2.addEventListener("click", function () {
            scrollRow(row, -SCROLL_AMOUNT);
          });
          row.addEventListener("scroll", function () {
            updateArrows(wrap);
          });
        });

        // Wheel — redirect to horizontal with smooth easing
        document.addEventListener(
          "wheel",
          function (e) {
            var wrap = e.target.closest(".horizontal-scroll-wrap");
            if (!wrap || !wrap._row) return;
            var row = wrap._row;
            if (!hasOverflow(row)) return;
            e.preventDefault();
            scrollRow(row, e.deltaY + e.deltaX);
          },
          { passive: false },
        );

        // Called by reader.js after #readerWrapper becomes visible
        window.initScrollArrows = function () {
          document
            .querySelectorAll(".horizontal-scroll-wrap")
            .forEach(function (wrap) {
              if (!wrap._row) return;
              // Double-rAF so layout is fully settled after display:none → block
              requestAnimationFrame(function () {
                requestAnimationFrame(function () {
                  updateArrows(wrap);
                  // Debounced resize observer to avoid flicker from rapid-fire callbacks
                  var timer = 0;
                  new ResizeObserver(function () {
                    clearTimeout(timer);
                    timer = setTimeout(function () {
                      updateArrows(wrap);
                    }, 50);
                  }).observe(wrap._row);
                });
              });
            });
        };
      })();
    </script>
  </body>
</html>
