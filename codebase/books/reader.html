<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <link rel="stylesheet" href="../css/styles.css" />
    <script>
      (function () {
        var t = localStorage.getItem("theme");
        if (t && t !== "light")
          document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
  </head>

      <button
        id="backToDashboard"
        title="Back to book list (Ctrl+b)"

        ↩
      </button>
      <button

        ↕

          left: 50%;
          transform: translateX(-50%);

        "

            width: 130px;
            height: 1rem;
            vertical-align: middle;
          "

      <h1 id="pageTitle"></h1>

            title="Close (Escape key)"

            ✕
          </button>
        </div>

          <div class="modal-card">
            <h3 class="modal-card-title" data-i18n="settingsAppearance">

            <div class="modal-row">
              <span class="modal-label" data-i18n="labelTheme">ތީމް</span>

              </select>
            </div>
            <div class="modal-row">

    <script type="module" src="../js/common.js"></script>
    <script type="module" src="../js/reader.js"></script>
    <div id="scrollCounter" class="scroll-counter"></div>
    <script>
      (function () {
        var SCROLL_AMOUNT = 100;
        function hasOverflow(el) {
          return el.scrollWidth > el.clientWidth + 1;
        }
        function isRTL(el) {
          return getComputedStyle(el).direction === "rtl";
        }

        // The row (toolbar/nav) is the scrollable element. The wrap just holds
        // absolutely-positioned arrows in its padding area.
        //
        // scrollLeft:  0 = at start,  mx = at end.  Increases toward end.
        function updateArrows(wrap) {
          if (!wrap) return;
          var row = wrap._row;
          if (!row || !hasOverflow(row)) {
            wrap._arrowStart.classList.add("hidden");
            wrap._arrowEnd.classList.add("hidden");
            return;
          }
          // scrollLeft:  0 = logical start,  -mx = logical end  (negative range in RTL)
          // Decreasing (-delta) → toward end.  Increasing (+delta) → toward start.
          var mx = row.scrollWidth - row.clientWidth;
          var atStart = row.scrollLeft > -1; // near 0 = at logical start
          var atEnd = row.scrollLeft < -mx + 1; // near -mx = at logical end
          wrap._arrowStart.classList.toggle("hidden", atStart);
          wrap._arrowEnd.classList.toggle("hidden", atEnd || mx < 1);
        }

        function scrollRow(row, delta) {
          var start = row.scrollLeft,
            target = start + delta;
          var duration = 300,
            t0 = performance.now();
          function easeOutCubic(t) {
            return 1 - Math.pow(1 - t, 3);
          }
          (function step(now) {
            var p = Math.min(1, (now - t0) / duration);
            row.scrollLeft = start + delta * easeOutCubic(p);
            updateArrows(row.closest(".h-scroll-wrap"));
            if (p < 1) requestAnimationFrame(step);
          })(t0);
        }

        // Wrap toolbar & nav rows — DOM ops work even in hidden subtrees.
        document
          .querySelectorAll(".reader-toolbar, .reader-nav")
          .forEach(function (row) {
            var rtl = isRTL(row),
              wrap = document.createElement("div");
            wrap.className = "h-scroll-wrap";
            if (rtl) wrap.dir = "rtl";
            var b1 = document.createElement("button"),
              b2 = document.createElement("button");
            b1.className = "scroll-arrow scroll-arrow-start";
            b1.innerHTML = rtl ? "&#9654;" : "&#9664;";
            b2.className = "scroll-arrow scroll-arrow-end";
            b2.innerHTML = rtl ? "&#9664;" : "&#9654;";
            // Store refs directly on the wrap so updateArrows never queries wrong element
            wrap._row = row;
            wrap._arrowStart = b1;
            wrap._arrowEnd = b2;
            row.parentNode.insertBefore(wrap, row);
            wrap.appendChild(b1);
            wrap.appendChild(row);
            wrap.appendChild(b2);
            // b1 (start arrow, ▶ in RTL): scroll toward start → +delta.
            // b2 (end   arrow, ◀ in RTL): scroll toward end   → -delta.
            b1.addEventListener("click", function () {
              scrollRow(row, SCROLL_AMOUNT);
            });
            b2.addEventListener("click", function () {
              scrollRow(row, -SCROLL_AMOUNT);
            });
            row.addEventListener("scroll", function () {
              updateArrows(wrap);
            });
          });

        // Wheel — redirect to horizontal with smooth easing
        document.addEventListener(
          "wheel",
          function (e) {
            var wrap = e.target.closest(".h-scroll-wrap");
            if (!wrap || !wrap._row) return;
            var row = wrap._row;
            if (!hasOverflow(row)) return;
            e.preventDefault();
            scrollRow(row, e.deltaY + e.deltaX);
          },
          { passive: false },
        );

        // Called by reader.js after #readerWrapper becomes visible
        window._initScrollArrows = function () {
          document.querySelectorAll(".h-scroll-wrap").forEach(function (wrap) {
            if (!wrap._row) return;
            // Double-rAF so layout is fully settled after display:none → block
            requestAnimationFrame(function () {
              requestAnimationFrame(function () {
                updateArrows(wrap);
                // Debounced resize observer to avoid flicker from rapid-fire callbacks
                var timer = 0;
                new ResizeObserver(function () {
                  clearTimeout(timer);
                  timer = setTimeout(function () {
                    updateArrows(wrap);
                  }, 50);
                }).observe(wrap._row);
              });
            });
          });
        };
      })();
    </script>
