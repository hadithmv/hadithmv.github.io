<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <link rel="stylesheet" href="../css/styles.css" />
    <!-- Apply saved theme before paint to avoid flash -->
    <script>
      (function () {
        var t = localStorage.getItem("theme");
        if (t && t !== "light") document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
  </head>

  <body>
    <!-- Hamburger menu button -->
    <button id="menuBtn" class="menu-btn" title="Menu">☰</button>

    <!-- Sidebar overlay -->
    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <h2 class="sidebar-title" data-i18n="sidebarTitle">Hadithmv</h2>
        <button id="sidebarClose" class="sidebar-close">✕</button>
      </div>

      <nav class="sidebar-nav">
        <a href="index.html" class="sidebar-link" data-i18n="navDashboard"
          >← ފޮތްތަކުގެ ލިސްޓް</a
        >
      </nav>

      <div class="sidebar-divider"></div>

      <nav class="sidebar-nav">
        <a
          href="https://github.com/hadithmv/hadithmv.github.io"
          target="_blank"
          rel="noopener"
          class="sidebar-link"
          data-i18n="navGitHub"
          >🐙 GitHub</a
        >
        <a href="faq.html" class="sidebar-link" data-i18n="navFaq">❓ FAQ</a>
        <a href="help.html" class="sidebar-link" data-i18n="navHelp">🛟 އެހީ</a>
        <a href="contact.html" class="sidebar-link" data-i18n="navContact"
          >📧 ގުޅުން</a
        >
      </nav>

      <div class="sidebar-divider"></div>

      <a id="btnSettings" class="sidebar-link" style="cursor: pointer">
        <span>⚙</span>
        <span data-i18n="labelSettings">ސެޓިންގްސް</span>
      </a>

      <a
        id="btnScrollTop"
        class="sidebar-link"
        style="cursor: pointer"
        data-i18n="navScrollTop"
        >⬆ މައްޗަށް</a
      >

      <div class="sidebar-footer">
        <div class="sidebar-version" data-i18n="appVersion">
          ވާޝަން 6.9.85 · ވެބް
        </div>
        <div class="sidebar-credit" data-i18n="appCredit">
          ހަދާފައިވަނީ: hadithmv
        </div>
      </div>
    </aside>

    <!-- Dashboard Container (shown when no book is selected) -->
    <div id="dashboardWrapper" style="display: none">
      <h1 class="dashboard-title" data-i18n="dashboardTitle">Hadithmv</h1>
      <div id="bookGrid" class="book-grid"></div>
    </div>

    <!-- Page Header with Metadata (shown once data is ready) -->
    <div id="pageHeader" style="display: none">
      <a
        href="index.html"
        id="backToDashboard"
        class="back-link"
        data-i18n="navDashboard"
        >← ފޮތްތަކުގެ ލިސްޓް</a
      >
      <h1 id="pageTitle"></h1>
      <div id="pageSubRow" style="display: none">
        <span class="subrow-left">
          <button id="btnFocusExpand" class="focus-expand-btn" data-i18n="btnFocusExpand">▼ ފޯކަސް ވިއު</button>
          <span id="focusPageIndicator" class="focus-page-indicator"></span>
        </span>
        <span class="subrow-right">
          <span id="pageTags"></span>
          <span id="pageSubtitle"></span>
        </span>
      </div>
    </div>

    <!-- Loading State -->
    <div id="loadingMessage" class="loading" dir="rtl" data-i18n="loading">
      ފޮތް ލޯޑް ކުރަނީ…
    </div>

    <!-- Error State -->
    <div id="errorMessage" class="error" style="display: none"></div>

    <!-- Reader Container (single-row vertical reading view) -->
    <div id="readerWrapper" style="display: none">
      <div id="searchBar">
        <input
          id="searchInput"
          type="search"
          class="search-input"
          data-i18n="searchPlaceholder"
          placeholder="މި ފޮތުން ހޯދާ…"
          dir="rtl"
        />
        <button
          id="searchClear"
          class="search-clear"
          title="Clear search"
          style="display: none"
        >
          ✕
        </button>
        <span id="searchInfo" class="search-info" style="display: none"></span>
      </div>
      <div
        id="searchResults"
        class="search-results"
        style="display: none"
      ></div>
      <div id="readerToolbar" class="reader-toolbar" dir="rtl">
        <div class="toolbar-group">
          <button
            id="btnCopy"
            class="toolbar-btn"
            title="Copy page to clipboard"
          >
            <span data-i18n="btnCopy">📋 ކޮޕީ ކުރޭ</span>
          </button>
          <button
            id="btnTashkeel"
            class="toolbar-btn"
            data-i18n-title="btnTashkeelTitle"
            title="Toggle Arabic diacritics (tashkeel)"
          >
            <span data-i18n="btnTashkeel">◉ ފިލި ފޮރުވާ</span>
          </button>
          <button
            id="btnReset"
            class="toolbar-btn"
            data-i18n-title="btnResetTitle"
            title="Reset all settings to defaults"
          >
            <span data-i18n="btnReset">↺ ރީސެޓް</span>
          </button>
        </div>
        <div class="toolbar-group">
          <label
            class="toolbar-label"
            for="selRowsPerPage"
            data-i18n="labelRowsPerPage"
            >އެއްފަހަރާ ދައްކަންވީ ކިތައް ސަފްހާ:</label
          >
          <select id="selRowsPerPage" class="toolbar-select">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="5">5</option>
          </select>
        </div>
        <div
          class="toolbar-group"
          id="columnTogglesGroup"
          style="display: none"
        >
          <button id="btnColDropdown" class="toolbar-btn" data-i18n="labelHideColumns">
            ކޮލަމް ފޮރުވާ ▾
          </button>
          <div id="columnDropdown" class="column-dropdown" style="display:none">
            <div id="columnToggles" class="column-toggles"></div>
          </div>
        </div>
      </div>
      <nav id="readerNav" class="reader-nav" dir="rtl">
        <div class="nav-pages">
          <button
            id="firstBtn"
            class="nav-btn nav-edge"
            title="First page (Home)"
          >
            ««
          </button>
          <button id="prevBtn" class="nav-btn" title="Previous page (←)">
            «
          </button>
          <span id="pageNumbers" class="page-numbers"></span>
          <button id="nextBtn" class="nav-btn" title="Next page (→)">»</button>
          <button id="lastBtn" class="nav-btn nav-edge" title="Last page (End)">
            »»
          </button>
        </div>
        <div class="nav-goto">
          <label for="pageInput" class="page-label" data-i18n="labelPageNo"
            >މި ސަފްހާގެ ނަންބަރު:</label
          >
          <input
            type="number"
            id="pageInput"
            class="page-input"
            min="1"
            inputmode="numeric"
            list="pageList"
          />
          <datalist id="pageList"></datalist>
          <span class="nav-counter" id="pageOfTotal"></span>
          <span class="nav-sep">|</span>
          <button
            id="btnFocus"
            class="nav-focus-btn"
            title="Toggle focus reading mode"
            data-i18n="btnFocusIn"
          >
            ▲ ފޯކަސް ވިއު
          </button>
        </div>
      </nav>
      <article id="readerContent" dir="rtl"></article>
      <nav id="readerNavBottom" class="reader-nav" dir="rtl">
        <div class="nav-pages">
          <button
            id="firstBtnBottom"
            class="nav-btn nav-edge"
            title="First page (Home)"
          >
            ««
          </button>
          <button id="prevBtnBottom" class="nav-btn" title="Previous page (←)">
            «
          </button>
          <span id="pageNumbersBottom" class="page-numbers"></span>
          <button id="nextBtnBottom" class="nav-btn" title="Next page (→)">
            »
          </button>
          <button
            id="lastBtnBottom"
            class="nav-btn nav-edge"
            title="Last page (End)"
          >
            »»
          </button>
        </div>
        <div class="nav-counter-bottom" id="pageOfTotalBottom"></div>
      </nav>
    </div>

    <script type="module">
      import { initI18n, setLanguage } from "../js/i18n.js";
      initI18n();
      document
        .getElementById("selLanguage")
        .addEventListener("change", function () {
          setLanguage(this.value);
        });

      // ── Font controls ──────────────────────────────────────
      var FONT_SIZES = [
        "1rem",
        "1.1rem",
        "1.2rem",
        "1.3rem",
        "1.4rem",
        "1.5rem",
        "1.65rem",
        "1.8rem",
        "2rem",
      ];
      var DEFAULT_FONT_SIZE = "1.25rem";
      var html = document.documentElement;

      function getFontSizeIdx() {
        var cur =
          html.style.getPropertyValue("--reader-font-size") ||
          DEFAULT_FONT_SIZE;
        var idx = FONT_SIZES.indexOf(cur);
        return idx === -1 ? FONT_SIZES.indexOf(DEFAULT_FONT_SIZE) : idx;
      }

      function applyFontSize(idx) {
        var size = FONT_SIZES[idx];
        html.style.setProperty("--reader-font-size", size);
        document.getElementById("fontSizeVal").textContent = size;
        try {
          localStorage.setItem("fontSize", size);
        } catch (_) {}
      }

      // Restore saved size
      var savedSize = (function () {
        try {
          return localStorage.getItem("fontSize");
        } catch (_) {
          return null;
        }
      })();
      if (savedSize && FONT_SIZES.indexOf(savedSize) !== -1) {
        html.style.setProperty("--reader-font-size", savedSize);
        document.getElementById("fontSizeVal").textContent = savedSize;
      }

      document
        .getElementById("btnFontDown")
        .addEventListener("click", function () {
          var idx = getFontSizeIdx();
          if (idx > 0) applyFontSize(idx - 1);
        });
      document
        .getElementById("btnFontUp")
        .addEventListener("click", function () {
          var idx = getFontSizeIdx();
          if (idx < FONT_SIZES.length - 1) applyFontSize(idx + 1);
        });

      // ── Font family toggle ─────────────────────────────────
      (function () {
        var btn = document.getElementById("btnFontToggle");
        var label = document.getElementById("fontFamilyLabel");
        var isSystem = (function () {
          try {
            return localStorage.getItem("fontSystem") === "1";
          } catch (_) {
            return false;
          }
        })();

        function set(sys) {
          isSystem = sys;
          if (sys) {
            html.setAttribute("data-font-system", "");
            btn.classList.add("active");
            label.textContent = "System";
          } else {
            html.removeAttribute("data-font-system");
            btn.classList.remove("active");
            label.textContent = "Hadithmv";
          }
          try {
            localStorage.setItem("fontSystem", sys ? "1" : "0");
          } catch (_) {}
        }

        set(isSystem);
        btn.addEventListener("click", function () {
          set(!isSystem);
        });
      })();
    </script>

    <script>
      // Sidebar toggle
      (function () {
        var sidebar = document.getElementById("sidebar");
        var overlay = document.getElementById("sidebarOverlay");
        var openBtn = document.getElementById("menuBtn");
        var closeBtn = document.getElementById("sidebarClose");

        function open() {
          sidebar.classList.add("open");
          overlay.classList.add("open");
        }
        function close() {
          sidebar.classList.remove("open");
          overlay.classList.remove("open");
        }
        openBtn.addEventListener("click", open);
        closeBtn.addEventListener("click", close);
        overlay.addEventListener("click", close);
        // Scroll-to-top
        document
          .getElementById("btnScrollTop")
          .addEventListener("click", function () {
            window.scrollTo({ top: 0, behavior: "smooth" });
            close();
          });
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape") close();
        });
      })();
    </script>

    <script src="../dependencies/papaparse.min.js"></script>

    <!-- Settings modal -->
    <div id="settingsOverlay" class="modal-overlay">
      <div id="settingsModal" class="modal" role="dialog">
        <div class="modal-header">
          <h2 class="modal-title" data-i18n="labelSettings">ސެޓިންގްސް</h2>
          <button id="btnResetSettings" class="modal-reset-sm" data-i18n="btnReset" title="Reset all settings">↺ ރީސެޓް</button>
          <button id="modalClose" class="modal-close">✕</button>
        </div>
        <div class="modal-body">
          <div class="modal-card">
            <h3 class="modal-card-title" data-i18n="settingsAppearance">
              ދިރުން
            </h3>
            <div class="modal-row">
              <span class="modal-label" data-i18n="labelTheme">ތީމް</span>
              <select id="selTheme" class="sidebar-select">
                <option value="light">☀️ ލައިޓް</option>
                <option value="dark">🌙 ޑާރކް</option>
                <option value="sepia">📜 ސީޕިއާ</option>
              </select>
            </div>
            <div class="modal-row">
              <span data-i18n="btnWidescreen">📐 ފުޅާ ސްކްރީން</span>
              <button id="btnWidescreen" class="modal-toggle">☐</button>
            </div>
          </div>
          <div class="modal-card">
            <h3 class="modal-card-title" data-i18n="settingsFont">ފޮންޓް</h3>
            <div class="modal-row">
              <span data-i18n="labelFontSize">ފޮންޓް ސައިޒު</span>
              <div class="font-size-row">
                <button
                  id="btnFontDown"
                  class="font-adj-btn"
                  title="Decrease font size"
                >
                  −
                </button>
                <span id="fontSizeVal" class="font-size-val">1.25rem</span>
                <button
                  id="btnFontUp"
                  class="font-adj-btn"
                  title="Increase font size"
                >
                  +
                </button>
              </div>
            </div>
            <div class="modal-row">
              <span data-i18n="labelFontFamily">ފޮންޓް ވައްތަރު</span>
              <button id="btnFontToggle" class="modal-toggle">
                <span id="fontFamilyLabel">Hadithmv</span>
              </button>
            </div>
          </div>
          <div class="modal-card">
            <h3 class="modal-card-title" data-i18n="settingsLanguage">ބަސް</h3>
            <div class="modal-row">
              <span>🌐</span>
              <select
                id="selLanguage"
                class="sidebar-select"
                data-i18n-title="btnLang"
                title="Change language"
              >
                <option value="dv">ދިވެހި</option>
                <option value="en">English</option>
                <option value="ar">العربية</option>
              </select>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      // All modal-backed controls — placed after modal HTML

      // Theme select
      (function () {
        var sel = document.getElementById("selTheme");
        var current = document.documentElement.getAttribute("data-theme") || "light";
        sel.value = current;
        sel.addEventListener("change", function () {
          var val = this.value;
          if (val === "light") document.documentElement.removeAttribute("data-theme");
          else document.documentElement.setAttribute("data-theme", val);
          localStorage.setItem("theme", val === "light" ? "" : val);
        });
      })();

      // Widescreen toggle
      (function () {
        var btn = document.getElementById("btnWidescreen");
        function set(on) {
          var html = document.documentElement;
          if (on) {
            html.setAttribute("data-widescreen", "");
            btn.classList.add("active");
            btn.textContent = "☑";
          } else {
            html.removeAttribute("data-widescreen");
            btn.classList.remove("active");
            btn.textContent = "☐";
          }
        }
        if (localStorage.getItem("widescreen")) {
          set(true);
        } else {
          btn.textContent = "☐";
        }
        btn.addEventListener("click", function () {
          var on = !document.documentElement.hasAttribute("data-widescreen");
          set(on);
          if (on) localStorage.setItem("widescreen", "1");
          else localStorage.removeItem("widescreen");
        });
      })();

      // Reset all settings
      document
        .getElementById("btnResetSettings")
        .addEventListener("click", function () {
          var html = document.documentElement;
          html.removeAttribute("data-theme");
          localStorage.setItem("theme", "");
          var thSel = document.getElementById("selTheme");
          if (thSel) thSel.value = "light";
          html.removeAttribute("data-widescreen");
          localStorage.removeItem("widescreen");
          var wsBtn = document.getElementById("btnWidescreen");
          if (wsBtn) {
            wsBtn.classList.remove("active");
            wsBtn.textContent = "☐";
          }
          html.style.removeProperty("--reader-font-size");
          localStorage.removeItem("fontSize");
          var fsv = document.getElementById("fontSizeVal");
          if (fsv) fsv.textContent = "1.25rem";
          html.removeAttribute("data-font-system");
          localStorage.removeItem("fontSystem");
          var ffBtn = document.getElementById("btnFontToggle");
          var ffLbl = document.getElementById("fontFamilyLabel");
          if (ffBtn) ffBtn.classList.remove("active");
          if (ffLbl) ffLbl.textContent = "Hadithmv";
          // Reader settings
          [
            "reader:rowsPerPage",
            "reader:hideTashkeel",
            "reader:hiddenColumns",
          ].forEach(function (k) {
            localStorage.removeItem(k);
          });
          localStorage.removeItem("focus");
          html.removeAttribute("data-focus");
          var fBtn = document.getElementById("btnFocus");
          if (fBtn) fBtn.classList.remove("active");
          document.dispatchEvent(new CustomEvent("readerset"));
          localStorage.removeItem("lang");
          var sel = document.getElementById("selLanguage");
          if (sel) sel.value = "dv";
          document.getElementById("settingsOverlay").classList.remove("open");
        });

      // Settings modal open / close
      (function () {
        var overlay = document.getElementById("settingsOverlay");
        var closeBtn = document.getElementById("modalClose");
        function open() {
          overlay.classList.add("open");
        }
        function close() {
          overlay.classList.remove("open");
        }
        document.getElementById("btnSettings").addEventListener("click", open);
        closeBtn.addEventListener("click", close);
        overlay.addEventListener("click", function (e) {
          if (e.target === overlay) close();
        });
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape") close();
        });
      })();
    </script>

    <script type="module" src="../js/reader.js"></script>
  </body>
</html>
