<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hadithmv</title>
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
  </head>

  <body>
    <div id="topBar">
      <button
        id="backToDashboard"
        title="Back to book list (Ctrl+b)"
        onclick="window.location.href = 'index.html'"
        style="display: none"
      >
        ↩
      </button>
      <button
        id="btnFocus"
        class="nav-focus-btn"
        title="Toggle focus reading mode (z key)"
        style="display: none"
      >
        ↕
      </button>
      <span
        id="topBarBrand"
        style="
          position: absolute;
          left: 50%;
          transform: translateX(-50%);
          font-weight: 800;
          font-size: 1.3rem;
          font-family:
            &quot;Hadithmv&quot;, &quot;Traditional Arabic&quot;, serif;
          color: var(--color-text);
          pointer-events: none;
        "
        >ހަދީޘްއެމްވީ</span
      >
      <h1 id="pageTitle" style="display: none"></h1>
      <button id="menuBtn" class="menu-btn" title="Menu (Escape to close)">
        ☰
      </button>
    </div>

    <!-- Sidebar overlay -->
    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <h2 class="sidebar-title" data-i18n="sidebarTitle">Hadithmv</h2>
        <button
          id="sidebarClose"
          class="sidebar-close"
          title="Close (Escape key)"
        >
          ✕
        </button>
      </div>

      <nav class="sidebar-nav">
        <a href="index.html" class="sidebar-link" data-i18n="navDashboard"
          >← ފޮތްތަކުގެ ލިސްޓް</a
        >
      </nav>

      <div class="sidebar-divider"></div>

      <nav class="sidebar-nav">
        <a
          href="https://github.com/hadithmv/hadithmv.github.io"
          target="_blank"
          rel="noopener"
          class="sidebar-link"
          data-i18n="navGitHub"
          >🐙 GitHub</a
        >
        <a href="faq.html" class="sidebar-link" data-i18n="navFaq">❓ FAQ</a>
        <a href="help.html" class="sidebar-link" data-i18n="navHelp">🛟 އެހީ</a>
        <a href="contact.html" class="sidebar-link" data-i18n="navContact"
          >📧 ގުޅުން</a
        >
      </nav>

      <div class="sidebar-divider"></div>

      <a
        id="btnSettings"
        class="sidebar-link"
        style="cursor: pointer"
        title="Open settings (Ctrl+,)"
      >
        <span>⚙</span>
        <span data-i18n="labelSettings">ސެޓިންގްސް</span>
      </a>

      <a
        id="btnScrollTop"
        class="sidebar-link"
        style="cursor: pointer"
        data-i18n="navScrollTop"
        >⬆ މައްޗަށް</a
      >

      <div class="sidebar-footer">
        <div class="sidebar-version" data-i18n="appVersion">
          ވާޝަން 6.9.85 · ވެބް
        </div>
        <div class="sidebar-credit" data-i18n="appCredit">
          ހަދާފައިވަނީ: hadithmv
        </div>
      </div>
    </aside>

    <div id="settingsOverlay" class="modal-overlay">
      <div id="settingsModal" class="modal" role="dialog">
        <div class="modal-header">
          <h2 class="modal-title" data-i18n="labelSettings">ސެޓިންގްސް</h2>
          <button
            id="btnResetSettings"
            class="modal-reset-sm"
            data-i18n="btnReset"
            title="Reset all settings"
          >
            ↺ ރީސެޓް
          </button>
          <button
            id="modalClose"
            class="modal-close"
            title="Close (Escape key)"
          >
            ✕
          </button>
        </div>
        <div class="modal-body">
          <div class="modal-card">
            <h3 class="modal-card-title" data-i18n="settingsAppearance">
              ފެންނަ ގޮތް
            </h3>
            <div class="modal-row">
              <span class="modal-label" data-i18n="labelTheme">ތީމް</span>
              <select id="selTheme" class="sidebar-select">
                <option value="light">☀️ ލައިޓް</option>
                <option value="dark">🌙 ޑާރކް</option>
                <option value="sepia">📜 ސީޕިއާ</option>
              </select>
            </div>
            <div class="modal-row">
              <span data-i18n="btnWidescreen">🖥️ ފުޅާ ސްކްރީން</span>
              <button id="btnWidescreen" class="modal-toggle">☐</button>
            </div>
          </div>
          <div class="modal-card">
            <h3 class="modal-card-title" data-i18n="settingsFont">ފޮންޓް</h3>
            <div class="modal-row">
              <span data-i18n="labelFontSize">ފޮންޓް ސައިޒު</span>
              <div class="font-size-row">
                <button
                  id="btnFontDown"
                  class="font-adj-btn"
                  title="Decrease font size"
                >
                  −
                </button>
                <span id="fontSizeVal" class="font-size-val">1.25rem</span>
                <button
                  id="btnFontUp"
                  class="font-adj-btn"
                  title="Increase font size"
                >
                  +
                </button>
              </div>
            </div>
            <div class="modal-row">
              <span data-i18n="labelFontFamily">ފޮންޓް ވައްތަރު</span>
              <select
                id="selFontFamily"
                class="sidebar-select"
                style="width: auto"
              >
                <option value="hadithmv">Hadithmv font</option>
                <option value="system">System font</option>
              </select>
            </div>
          </div>
          <div class="modal-card">
            <h3 class="modal-card-title" data-i18n="settingsLanguage">ބަސް</h3>
            <div class="modal-row">
              <span>🌐</span>
              <select
                id="selLanguage"
                class="sidebar-select"
                title="Change language"
              >
                <option value="dv">ދިވެހި - Dhivehi - الديفيهية</option>
                <option value="en">އިނގިރޭސި - English - إنجليزي</option>
                <option value="ar">އަރަބި - Arabic - العربية</option>
              </select>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Dashboard Container (shown when no book is selected) -->
    <div id="dashboardWrapper" style="display: none">
      <div id="dashboardControls">
        <div id="dashboardSearchBar">
          <button
            id="dashboardSearchClear"
            class="search-clear"
            title="Clear search"
            style="display: none"
          >
            ✕
          </button>
          <input
            id="dashboardSearch"
            type="search"
            class="search-input"
            data-i18n="dashboardSearchPlaceholder"
            placeholder="Search books…"
            dir="rtl"
          />
        </div>
        <div id="dashboardTagChips"></div>
        <div id="dashboardSortRow">
          <span id="dashboardResultCount" class="search-info"></span>
          <div style="display: flex; gap: 6px; align-items: stretch">
            <button
              id="dashboardReset"
              class="toolbar-btn"
              data-i18n="btnResetText"
            >
              ↺ ރީސެޓް
            </button>
            <button
              id="dashboardViewToggle"
              class="toolbar-btn"
              data-i18n="btnViewToggleText"
            >
              📖 ޓޭބަލް
            </button>
            <select id="dashboardSort" class="toolbar-select">
              <option value="az" data-i18n="dashboardSortAZ">A → Z</option>
              <option value="za" data-i18n="dashboardSortZA">Z ← A</option>
            </select>
          </div>
        </div>
      </div>
      <div id="bookGrid" class="book-grid"></div>
    </div>

    <!-- Loading State -->
    <div id="loadingMessage" class="skeleton" dir="rtl">
      <div class="skeleton-line"></div>
      <div class="skeleton-line"></div>
      <div class="skeleton-line"></div>
      <div class="skeleton-line"></div>
      <div class="skeleton-line"></div>
      <div class="skeleton-line"></div>
      <div class="skeleton-line"></div>
      <div class="skeleton-line"></div>
      <div class="skeleton-line"></div>
      <div class="skeleton-line"></div>
      <div class="skeleton-line"></div>
      <div class="skeleton-line"></div>
      <div class="skeleton-line"></div>
      <div class="skeleton-line"></div>
      <div class="skeleton-line"></div>
    </div>

    <!-- Error State -->
    <div id="errorMessage" class="error" style="display: none"></div>

    <script src="../dependencies/papaparse.min.js"></script>
    <script type="module" src="../js/common.js"></script>
    <script type="module">
      import { initializePageWithMetadata } from "../js/catalog.js";
      initializePageWithMetadata(function () {});
    </script>
  </body>
</html>
