<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <link rel="stylesheet" href="../css/styles.css" />
    <!-- Apply saved theme before paint to avoid flash -->
    <script>
      (function(){var t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-theme",t);})();
    </script>
  </head>

  <body>
    <!-- Theme toggle -->
    <button id="themeToggle" title="Toggle dark / light theme">
      <span class="icon-dark">🌙</span>
      <span class="icon-light">☀️</span>
      <span class="label-dark">Dark</span>
      <span class="label-light">Light</span>
    </button>
    <!-- Dashboard Container (shown when no book is selected) -->
    <div id="dashboardWrapper" style="display: none">
      <h1 class="dashboard-title">Hadithmv</h1>
      <div id="bookGrid" class="book-grid"></div>
    </div>

    <!-- Page Header with Metadata (shown once data is ready) -->
    <div id="pageHeader" style="display: none">
      <h1 id="pageTitle"></h1>
      <p id="pageSubtitle"></p>
      <p id="pageSubsubtitle"></p>
      <div id="pageTags"></div>
    </div>

    <!-- Loading State -->
    <div id="loadingMessage" class="loading">Loading book data...</div>

    <!-- Error State -->
    <div id="errorMessage" class="error" style="display: none"></div>

    <!-- Reader Container (single-row vertical reading view) -->
    <div id="readerWrapper" style="display: none">
      <div id="searchBar">
        <input
          id="searchInput"
          type="search"
          class="search-input"
          placeholder="Search this book…"
          dir="auto"
        />
        <button id="searchClear" class="search-clear" title="Clear search" style="display: none">✕</button>
        <span id="searchInfo" class="search-info" style="display: none"></span>
      </div>
      <nav id="readerNav">
        <button id="prevBtn" class="nav-btn" title="Previous (← arrow key)">← Previous</button>
        <span id="rowCounter" class="nav-counter"></span>
        <button id="nextBtn" class="nav-btn" title="Next (→ arrow key)">Next →</button>
      </nav>
      <article id="readerContent" dir="rtl"></article>
      <nav id="readerNavBottom">
        <button id="prevBtnBottom" class="nav-btn" title="Previous (← arrow key)">← Previous</button>
        <span id="rowCounterBottom" class="nav-counter"></span>
        <button id="nextBtnBottom" class="nav-btn" title="Next (→ arrow key)">Next →</button>
      </nav>
    </div>

    <script>
      // Theme toggle — runs before module so it works on dashboard too
      document.getElementById("themeToggle").addEventListener("click", function () {
        var html = document.documentElement;
        var next = html.getAttribute("data-theme") === "dark" ? "light" : "dark";
        html.setAttribute("data-theme", next);
        localStorage.setItem("theme", next);
      });
    </script>

    <script src="../dependencies/papaparse.min.js"></script>

    <script type="module">
      import {
        initializePageWithMetadata,
        extractTags,
      } from "../js/dbLookup.js";

      initializePageWithMetadata(async function (metadata) {
        // Set document title immediately
        document.title = metadata.titleEN || metadata.bookCode;

        // Load CSV data — keep loading visible until everything is ready
        Papa.parse(metadata.csvPath, {
          download: true,
          header: false,
          dynamicTyping: true,
          complete: function (results) {
            const data = results.data.filter(
              (row) =>
                Array.isArray(row) &&
                row.some((value) => value !== null && value !== ""),
            );

            if (data.length === 0) {
              showError("No data found in CSV file: " + metadata.csvPath);
              return;
            }

            // Detect and remove a header row (convention: first field is "#")
            // The header row is for the author's reference and is not displayed.
            if (data.length > 0 && data[0][0] === "#") {
              data.shift();
            }

            // Populate page header
            document.getElementById("pageTitle").textContent =
              metadata.titleEN || metadata.bookCode;
            document.getElementById("pageSubtitle").textContent =
              metadata.titleAR || "";
            document.getElementById("pageSubsubtitle").textContent =
              metadata.titleDV || "";

            // Render tags in page header
            const pageTagsContainer = document.getElementById("pageTags");
            const tags = extractTags(metadata.bookCode);
            if (tags.length > 0) {
              pageTagsContainer.innerHTML = tags
                .map(
                  (t) =>
                    `<span class="tag-badge" style="color:${t.color};background:${t.bg}">${t.label}</span>`,
                )
                .join("");
            }

            // ── Reader state ──────────────────────────────────────
            const allData = data;               // never changes
            let filteredData = allData;         // subset when searching
            let currentIndex = 0;

            function rowCount() { return filteredData.length; }

            function renderRow(index) {
              const row = filteredData[index];
              if (!row) return;

              const rowNum = row[0] || index + 1;
              let html = `<div class="reader-row-num">#${rowNum}</div>`;

              // Collect non-empty columns (skip col 0 — the row number)
              const fields = [];
              for (let i = 1; i < row.length; i++) {
                const value = row[i];
                if (value !== null && value !== undefined && String(value).trim() !== "") {
                  fields.push({ index: i, value: String(value).trim() });
                }
              }

              // Render all fields, with a divider before the last one
              for (let i = 0; i < fields.length; i++) {
                if (i === fields.length - 1 && fields.length > 1) {
                  html += `<div class="reader-divider"></div>`;
                  html += `<div class="reader-field reader-footnotes" dir="auto">${fields[i].value}</div>`;
                } else {
                  html += `<div class="reader-field" dir="auto">${fields[i].value}</div>`;
                }
              }

              document.getElementById("readerContent").innerHTML = html;

              // Build counter text
              const total = rowCount();
              let counterText = `Row ${index + 1} of ${total}`;
              const query = document.getElementById("searchInput").value.trim();
              if (query && total !== allData.length) {
                counterText += ` · ${total} match${total === 1 ? "" : "es"}`;
              }

              document.getElementById("rowCounter").textContent = counterText;
              document.getElementById("rowCounterBottom").textContent = counterText;

              // Update button states
              document.getElementById("prevBtn").disabled = index === 0;
              document.getElementById("prevBtnBottom").disabled = index === 0;
              document.getElementById("nextBtn").disabled = index === total - 1;
              document.getElementById("nextBtnBottom").disabled = index === total - 1;

              // Scroll reader into view
              document.getElementById("readerContent").scrollIntoView({ behavior: "smooth", block: "start" });
            }

            function goTo(index) {
              const total = rowCount();
              if (index >= 0 && index < total) {
                currentIndex = index;
                renderRow(currentIndex);
              }
            }

            // ── Search ─────────────────────────────────────────
            const searchInput = document.getElementById("searchInput");
            const searchClear = document.getElementById("searchClear");
            const searchInfo  = document.getElementById("searchInfo");

            function applySearch(query) {
              const q = query.trim();
              if (!q) {
                // Reset to full dataset
                filteredData = allData;
                currentIndex = 0;
                searchClear.style.display = "none";
                searchInfo.style.display = "none";
              } else {
                const lower = q.toLowerCase();
                filteredData = allData.filter(function (row) {
                  return row.some(function (cell) {
                    return cell !== null && cell !== undefined &&
                           String(cell).toLowerCase().indexOf(lower) !== -1;
                  });
                });
                currentIndex = 0;
                searchClear.style.display = "";
                searchInfo.style.display = "";
                if (filteredData.length === 0) {
                  searchInfo.textContent = "No matches";
                } else {
                  searchInfo.textContent = filteredData.length + " match" + (filteredData.length === 1 ? "" : "es");
                }
              }
              if (filteredData.length === 0) {
                document.getElementById("readerContent").innerHTML =
                  '<div class="reader-no-results">No rows match "' + query + '"</div>';
              } else {
                renderRow(currentIndex);
              }
            }

            searchInput.addEventListener("input", function () {
              applySearch(this.value);
            });

            searchClear.addEventListener("click", function () {
              searchInput.value = "";
              applySearch("");
              searchInput.focus();
            });

            // ── Navigation ─────────────────────────────────────
            // Wire navigation — top bar
            document.getElementById("prevBtn").addEventListener("click", () => goTo(currentIndex - 1));
            document.getElementById("nextBtn").addEventListener("click", () => goTo(currentIndex + 1));

            // Wire navigation — bottom bar
            document.getElementById("prevBtnBottom").addEventListener("click", () => goTo(currentIndex - 1));
            document.getElementById("nextBtnBottom").addEventListener("click", () => goTo(currentIndex + 1));

            // Keyboard: arrow keys navigate, / focuses search
            document.addEventListener("keydown", function onKey(e) {
              // Don't steal focus when typing in search
              if (document.activeElement === searchInput) return;

              if (e.key === "ArrowLeft")   { e.preventDefault(); goTo(currentIndex - 1); }
              if (e.key === "ArrowRight")  { e.preventDefault(); goTo(currentIndex + 1); }
              if (e.key === "/" || e.key === "f" && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                searchInput.focus();
                searchInput.select();
              }
            });

            // Initial render
            renderRow(0);

            // Reveal everything at once
            document.getElementById("loadingMessage").style.display = "none";
            document.getElementById("pageHeader").style.display = "block";
            document.getElementById("readerWrapper").style.display = "block";
          },
          error: function (err) {
            showError("Error loading CSV: " + err);
          },
        });
      });

      function showError(message) {
        document.getElementById("loadingMessage").style.display = "none";
        document.getElementById("errorMessage").textContent = message;
        document.getElementById("errorMessage").style.display = "block";
        console.error(message);
      }
    </script>
  </body>
</html>
