<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <link rel="stylesheet" href="../css/styles.css" />
    <!-- Apply saved theme before paint to avoid flash -->
    <script>
      (function(){var t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-theme",t);})();
    </script>
  </head>

  <body>
    <!-- Theme toggle -->
    <button id="themeToggle" title="Toggle dark / light theme">
      <span class="icon-dark">🌙</span>
      <span class="icon-light">☀️</span>
      <span class="label-dark">Dark</span>
      <span class="label-light">Light</span>
    </button>
    <!-- Dashboard Container (shown when no book is selected) -->
    <div id="dashboardWrapper" style="display: none">
      <h1 class="dashboard-title">Hadithmv</h1>
      <div id="bookGrid" class="book-grid"></div>
    </div>

    <!-- Page Header with Metadata (shown once data is ready) -->
    <div id="pageHeader" style="display: none">
      <h1 id="pageTitle"></h1>
      <p id="pageSubtitle"></p>
      <p id="pageSubsubtitle"></p>
      <div id="pageTags"></div>
    </div>

    <!-- Loading State -->
    <div id="loadingMessage" class="loading">Loading book data...</div>

    <!-- Error State -->
    <div id="errorMessage" class="error" style="display: none"></div>

    <!-- Reader Container (single-row vertical reading view) -->
    <div id="readerWrapper" style="display: none">
      <div id="searchBar">
        <input
          id="searchInput"
          type="search"
          class="search-input"
          placeholder="Search this book…"
          dir="auto"
        />
        <button id="searchClear" class="search-clear" title="Clear search" style="display: none">✕</button>
        <span id="searchInfo" class="search-info" style="display: none"></span>
      </div>
      <nav id="readerNav" class="reader-nav">
        <div class="nav-pages">
          <button id="firstBtn" class="nav-btn nav-edge" title="First page (Home)">««</button>
          <button id="prevBtn" class="nav-btn" title="Previous page (←)">«</button>
          <span id="pageNumbers" class="page-numbers"></span>
          <button id="nextBtn" class="nav-btn" title="Next page (→)">»</button>
          <button id="lastBtn" class="nav-btn nav-edge" title="Last page (End)">»»</button>
        </div>
        <div class="nav-goto">
          <label for="pageInput" class="page-label">Page</label>
          <input type="number" id="pageInput" class="page-input" min="1" inputmode="numeric" list="pageList" />
          <datalist id="pageList"></datalist>
          <span class="nav-counter" id="pageOfTotal"></span>
        </div>
      </nav>
      <article id="readerContent" dir="rtl"></article>
      <nav id="readerNavBottom" class="reader-nav">
        <div class="nav-pages">
          <button id="firstBtnBottom" class="nav-btn nav-edge" title="First page (Home)">««</button>
          <button id="prevBtnBottom" class="nav-btn" title="Previous page (←)">«</button>
          <span id="pageNumbersBottom" class="page-numbers"></span>
          <button id="nextBtnBottom" class="nav-btn" title="Next page (→)">»</button>
          <button id="lastBtnBottom" class="nav-btn nav-edge" title="Last page (End)">»»</button>
        </div>
        <div class="nav-counter-bottom" id="pageOfTotalBottom"></div>
      </nav>
    </div>

    <script>
      // Theme toggle — runs before module so it works on dashboard too
      document.getElementById("themeToggle").addEventListener("click", function () {
        var html = document.documentElement;
        var next = html.getAttribute("data-theme") === "dark" ? "light" : "dark";
        html.setAttribute("data-theme", next);
        localStorage.setItem("theme", next);
      });
    </script>

    <script src="../dependencies/papaparse.min.js"></script>

    <script type="module">
      import {
        initializePageWithMetadata,
        extractTags,
      } from "../js/dbLookup.js";

      initializePageWithMetadata(async function (metadata) {
        // Set document title immediately
        document.title = metadata.titleEN || metadata.bookCode;

        // Load CSV data — keep loading visible until everything is ready
        Papa.parse(metadata.csvPath, {
          download: true,
          header: false,
          dynamicTyping: true,
          complete: function (results) {
            const data = results.data.filter(
              (row) =>
                Array.isArray(row) &&
                row.some((value) => value !== null && value !== ""),
            );

            if (data.length === 0) {
              showError("No data found in CSV file: " + metadata.csvPath);
              return;
            }

            // Detect and remove a header row (convention: first field is "#")
            // The header row is for the author's reference and is not displayed.
            if (data.length > 0 && data[0][0] === "#") {
              data.shift();
            }

            // Populate page header
            document.getElementById("pageTitle").textContent =
              metadata.titleEN || metadata.bookCode;
            document.getElementById("pageSubtitle").textContent =
              metadata.titleAR || "";
            document.getElementById("pageSubsubtitle").textContent =
              metadata.titleDV || "";

            // Render tags in page header
            const pageTagsContainer = document.getElementById("pageTags");
            const tags = extractTags(metadata.bookCode);
            if (tags.length > 0) {
              pageTagsContainer.innerHTML = tags
                .map(
                  (t) =>
                    `<span class="tag-badge" style="color:${t.color};background:${t.bg}">${t.label}</span>`,
                )
                .join("");
            }

            // ── Reader state ──────────────────────────────────────
            const allData = data;               // never changes
            let filteredData = allData;         // subset when searching
            let currentIndex = 0;
            const searchInput   = document.getElementById("searchInput");
            const searchClear   = document.getElementById("searchClear");
            const searchInfo    = document.getElementById("searchInfo");
            const pageInput     = document.getElementById("pageInput");
            const pageList      = document.getElementById("pageList");
            const pageOfTotal   = document.getElementById("pageOfTotal");
            const pageOfTotalBtm = document.getElementById("pageOfTotalBottom");

            function totalPages() { return filteredData.length; }
            function pageLabel(n) { return "Page " + n; }

            // ── Render current page ────────────────────────────
            function renderPage(index) {
              const row = filteredData[index];
              if (!row) return;

              const rowNum = row[0] || index + 1;
              let html = `<div class="reader-row-num">#${rowNum}</div>`;
              const fields = [];
              for (let i = 1; i < row.length; i++) {
                const v = row[i];
                if (v !== null && v !== undefined && String(v).trim() !== "") {
                  fields.push({ value: String(v).trim() });
                }
              }
              for (let i = 0; i < fields.length; i++) {
                if (i === fields.length - 1 && fields.length > 1) {
                  html += `<div class="reader-divider"></div>`;
                  html += `<div class="reader-field reader-footnotes" dir="auto">${fields[i].value}</div>`;
                } else {
                  html += `<div class="reader-field" dir="auto">${fields[i].value}</div>`;
                }
              }
              document.getElementById("readerContent").innerHTML = html;

              updatePagination();
              document.getElementById("readerContent").scrollIntoView({ behavior: "smooth", block: "start" });
            }

            // ── Pagination UI ──────────────────────────────────
            function pageNumbersHTML(current, total) {
              if (total <= 1) return "";
              if (total <= 9) {
                // Show all
                let h = "";
                for (let p = 1; p <= total; p++) {
                  h += pageBtn(p, p === current);
                }
                return h;
              }
              // Sliding window: first … window … last
              let h = pageBtn(1, current === 1);
              if (current > 4) h += `<span class="page-ellipsis">…</span>`;

              const start = Math.max(2, current - 2);
              const end   = Math.min(total - 1, current + 2);
              for (let p = start; p <= end; p++) {
                h += pageBtn(p, p === current);
              }

              if (current < total - 3) h += `<span class="page-ellipsis">…</span>`;
              h += pageBtn(total, current === total);
              return h;
            }

            function pageBtn(page, active) {
              return `<button class="page-num${active ? " active" : ""}" data-page="${page}">${page}</button>`;
            }

            function updatePagination() {
              const total = totalPages();
              const cur   = currentIndex + 1; // 1-based for display

              // Page strip
              const strip = pageNumbersHTML(cur, total);
              document.getElementById("pageNumbers").innerHTML = strip;
              document.getElementById("pageNumbersBottom").innerHTML = strip;

              // Wire page-number click handlers
              document.querySelectorAll(".page-num").forEach(function (btn) {
                btn.addEventListener("click", function () {
                  goTo(parseInt(this.dataset.page) - 1);
                });
              });

              // Edge buttons
              var atFirst = currentIndex === 0;
              var atLast  = currentIndex === total - 1;
              document.getElementById("firstBtn").disabled = atFirst;
              document.getElementById("prevBtn").disabled  = atFirst;
              document.getElementById("nextBtn").disabled  = atLast;
              document.getElementById("lastBtn").disabled  = atLast;
              document.getElementById("firstBtnBottom").disabled = atFirst;
              document.getElementById("prevBtnBottom").disabled  = atFirst;
              document.getElementById("nextBtnBottom").disabled  = atLast;
              document.getElementById("lastBtnBottom").disabled  = atLast;

              // Counter text
              var cnt = `Page ${cur} of ${total}`;
              var query = searchInput.value.trim();
              if (query && total !== allData.length) {
                cnt += ` · ${total} match${total === 1 ? "" : "es"}`;
              }
              if (pageOfTotal) pageOfTotal.textContent = cnt;
              if (pageOfTotalBtm) pageOfTotalBtm.textContent = `Page ${cur} of ${total}`;

              // Page input
              if (pageInput) {
                pageInput.max = total;
                pageInput.value = cur;
              }

              // Datalist — rebuild when total changes
              if (pageList && pageList.options.length !== total) {
                pageList.innerHTML = "";
                for (var p = 1; p <= total; p++) {
                  var opt = document.createElement("option");
                  opt.value = p;
                  pageList.appendChild(opt);
                }
              }
            }

            function goTo(index) {
              var total = totalPages();
              if (total === 0) return;
              if (index < 0) index = 0;
              if (index >= total) index = total - 1;
              currentIndex = index;
              renderPage(currentIndex);
            }

            // ── Search ─────────────────────────────────────────
            function applySearch(query) {
              var q = query.trim();
              if (!q) {
                filteredData = allData;
                currentIndex = 0;
                searchClear.style.display = "none";
                searchInfo.style.display = "none";
              } else {
                var lower = q.toLowerCase();
                filteredData = allData.filter(function (row) {
                  return row.some(function (cell) {
                    return cell !== null && cell !== undefined &&
                           String(cell).toLowerCase().indexOf(lower) !== -1;
                  });
                });
                currentIndex = 0;
                searchClear.style.display = "";
                searchInfo.style.display = "";
                if (filteredData.length === 0) {
                  searchInfo.textContent = "No matches";
                } else {
                  searchInfo.textContent = filteredData.length + " match" + (filteredData.length === 1 ? "" : "es");
                }
              }
              if (filteredData.length === 0) {
                document.getElementById("readerContent").innerHTML =
                  '<div class="reader-no-results">No rows match "' + query + '"</div>';
                updatePagination();
              } else {
                renderPage(currentIndex);
              }
            }

            searchInput.addEventListener("input", function () {
              applySearch(this.value);
            });
            searchClear.addEventListener("click", function () {
              searchInput.value = "";
              applySearch("");
              searchInput.focus();
            });

            // ── Navigation: buttons ────────────────────────────
            function bindNav(id, delta) {
              document.getElementById(id).addEventListener("click", function () {
                goTo(currentIndex + delta);
              });
            }
            bindNav("firstBtn", -currentIndex);
            bindNav("prevBtn", -1);
            bindNav("nextBtn", 1);
            bindNav("lastBtn", totalPages() - 1 - currentIndex);
            bindNav("firstBtnBottom", -currentIndex);
            bindNav("prevBtnBottom", -1);
            bindNav("nextBtnBottom", 1);
            bindNav("lastBtnBottom", totalPages() - 1 - currentIndex);

            // Fix Last buttons to always jump to end
            document.getElementById("lastBtn").addEventListener("click", function () {
              goTo(totalPages() - 1);
            });
            document.getElementById("lastBtnBottom").addEventListener("click", function () {
              goTo(totalPages() - 1);
            });
            // Fix First buttons
            document.getElementById("firstBtn").addEventListener("click", function () {
              goTo(0);
            });
            document.getElementById("firstBtnBottom").addEventListener("click", function () {
              goTo(0);
            });

            // ── Navigation: page input ─────────────────────────
            pageInput.addEventListener("keydown", function (e) {
              if (e.key === "Enter") {
                e.preventDefault();
                var v = parseInt(pageInput.value, 10);
                if (!isNaN(v) && v >= 1 && v <= totalPages()) {
                  goTo(v - 1);
                } else {
                  pageInput.value = currentIndex + 1;
                }
              }
            });
            pageInput.addEventListener("change", function () {
              var v = parseInt(pageInput.value, 10);
              if (!isNaN(v) && v >= 1 && v <= totalPages()) {
                goTo(v - 1);
              } else {
                pageInput.value = currentIndex + 1;
              }
            });

            // ── Keyboard ───────────────────────────────────────
            document.addEventListener("keydown", function onKey(e) {
              if (document.activeElement === searchInput ||
                  document.activeElement === pageInput) return;

              if (e.key === "ArrowLeft")   { e.preventDefault(); goTo(currentIndex - 1); }
              if (e.key === "ArrowRight")  { e.preventDefault(); goTo(currentIndex + 1); }
              if (e.key === "Home")        { e.preventDefault(); goTo(0); }
              if (e.key === "End")         { e.preventDefault(); goTo(totalPages() - 1); }
              if (e.key === "/" || (e.key === "f" && (e.ctrlKey || e.metaKey))) {
                e.preventDefault();
                searchInput.focus();
                searchInput.select();
              }
            });

            // Initial render
            renderPage(0);

            // Reveal everything at once
            document.getElementById("loadingMessage").style.display = "none";
            document.getElementById("pageHeader").style.display = "block";
            document.getElementById("readerWrapper").style.display = "block";
          },
          error: function (err) {
            showError("Error loading CSV: " + err);
          },
        });
      });

      function showError(message) {
        document.getElementById("loadingMessage").style.display = "none";
        document.getElementById("errorMessage").textContent = message;
        document.getElementById("errorMessage").style.display = "block";
        console.error(message);
      }
    </script>
  </body>
</html>
