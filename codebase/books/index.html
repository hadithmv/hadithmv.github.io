<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <link rel="stylesheet" href="../css/styles.css" />
    <!-- Apply saved theme before paint to avoid flash -->
    <script>
      (function () {
        var t = localStorage.getItem("theme");
        if (t) document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
  </head>

  <body>
    <!-- Hamburger menu button -->
    <button id="menuBtn" class="menu-btn" title="Menu">☰</button>

    <!-- Sidebar overlay -->
    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <h2 class="sidebar-title" data-i18n="sidebarTitle">Hadithmv</h2>
        <button id="sidebarClose" class="sidebar-close">✕</button>
      </div>
      <nav class="sidebar-nav">
        <a href="index.html" class="sidebar-link" data-i18n="navDashboard">← ފޮތް ތަކުގެ ލިސްޓް</a>
        <a href="contact.html" class="sidebar-link" data-i18n="navContact">📧 ގުޅުން</a>
      </nav>
      <div class="sidebar-section">
        <button id="btnWidescreen" class="sidebar-theme-btn" title="Toggle widescreen mode">
          <span data-i18n="btnWidescreen">📐 ފުޅާ ސްކްރީން</span>
        </button>
        <button id="btnLang" class="sidebar-theme-btn" title="Change language">
          <span data-i18n="btnLang">🌐 ބަސް</span>
          <span class="lang-indicator" data-i18n="langLabel">ދިވެހި</span>
        </button>
        <button id="themeToggle" class="sidebar-theme-btn" title="Toggle dark / light theme">
          <span class="icon-dark">🌙</span>
          <span class="icon-light">☀️</span>
          <span class="label-dark" data-i18n="labelDark">ޑާރކް މޯޑް</span>
          <span class="label-light" data-i18n="labelLight">ލައިޓް މޯޑް</span>
        </button>
      </div>
      <div class="sidebar-footer">
        <div class="sidebar-version" data-i18n="appVersion">ވާޝަން 6.9.85 · ވެބް</div>
        <div class="sidebar-credit" data-i18n="appCredit">ހަދާފައިވަނީ: hadithmv</div>
      </div>
    </aside>

    <!-- Dashboard Container (shown when no book is selected) -->
    <div id="dashboardWrapper" style="display: none">
      <h1 class="dashboard-title" data-i18n="dashboardTitle">Hadithmv</h1>
      <div id="bookGrid" class="book-grid"></div>
    </div>

    <!-- Page Header with Metadata (shown once data is ready) -->
    <div id="pageHeader" style="display: none">
      <a href="index.html" id="backToDashboard" class="back-link" data-i18n="navDashboard">← ފޮތް ތަކުގެ ލިސްޓް</a>
      <h1 id="pageTitle"></h1>
      <p id="pageSubtitle"></p>
      <p id="pageSubsubtitle"></p>
      <div id="pageTags"></div>
    </div>

    <!-- Loading State -->
    <div id="loadingMessage" class="loading" dir="rtl" data-i18n="loading">ފޮތް ލޯޑް ކުރަނީ…</div>

    <!-- Error State -->
    <div id="errorMessage" class="error" style="display: none"></div>

    <!-- Reader Container (single-row vertical reading view) -->
    <div id="readerWrapper" style="display: none">
      <div id="searchBar">
        <input
          id="searchInput"
          type="search"
          class="search-input"
          data-i18n="searchPlaceholder" placeholder="މި ފޮތުން ހޯދާ…"
          dir="rtl"
        />
        <button
          id="searchClear"
          class="search-clear"
          title="Clear search"
          style="display: none"
        >
          ✕
        </button>
        <span id="searchInfo" class="search-info" style="display: none"></span>
      </div>
      <div id="searchResults" class="search-results" style="display: none"></div>
      <div id="readerToolbar" class="reader-toolbar" dir="rtl">
        <div class="toolbar-group">
          <button
            id="btnCopy"
            class="toolbar-btn"
            title="Copy page to clipboard"
          >
            <span data-i18n="btnCopy">📋 ކޮޕީ ކުރޭ</span>
          </button>
          <button
            id="btnTashkeel"
            class="toolbar-btn"
            data-i18n-title="btnTashkeelTitle"
            title="Toggle Arabic diacritics (tashkeel)"
          >
            <span data-i18n="btnTashkeel">◉ ފިލި ފޮރުވާ</span>
          </button>
          <button id="btnReset" class="toolbar-btn" data-i18n-title="btnResetTitle" title="Reset all settings to defaults">
            <span data-i18n="btnReset">↺ ރީސެޓް</span>
          </button>
        </div>
        <div class="toolbar-group">
          <label class="toolbar-label" for="selRowsPerPage"
            data-i18n="labelRowsPerPage"
            >އެއްފަހަރާ ދައްކަންވީ ކިތައް ސަފްހާ:</label
          >
          <select id="selRowsPerPage" class="toolbar-select">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="5">5</option>
          </select>
        </div>
        <div
          class="toolbar-group"
          id="columnTogglesGroup"
          style="display: none"
        >
          <label class="toolbar-label" data-i18n="labelHideColumns">ކޮލަމް ފޮރުވާ:</label>
          <div id="columnToggles" class="column-toggles"></div>
        </div>
      </div>
      <nav id="readerNav" class="reader-nav" dir="rtl">
        <div class="nav-pages">
          <button
            id="firstBtn"
            class="nav-btn nav-edge"
            title="First page (Home)"
          >
            ««
          </button>
          <button id="prevBtn" class="nav-btn" title="Previous page (←)">
            «
          </button>
          <span id="pageNumbers" class="page-numbers"></span>
          <button id="nextBtn" class="nav-btn" title="Next page (→)">»</button>
          <button id="lastBtn" class="nav-btn nav-edge" title="Last page (End)">
            »»
          </button>
        </div>
        <div class="nav-goto">
          <label for="pageInput" class="page-label"
            data-i18n="labelPageNo"
            >މި ސަފްހާގެ ނަންބަރު:</label
          >
          <input
            type="number"
            id="pageInput"
            class="page-input"
            min="1"
            inputmode="numeric"
            list="pageList"
          />
          <datalist id="pageList"></datalist>
          <span class="nav-counter" id="pageOfTotal"></span>
        </div>
      </nav>
      <article id="readerContent" dir="rtl"></article>
      <nav id="readerNavBottom" class="reader-nav" dir="rtl">
        <div class="nav-pages">
          <button
            id="firstBtnBottom"
            class="nav-btn nav-edge"
            title="First page (Home)"
          >
            ««
          </button>
          <button id="prevBtnBottom" class="nav-btn" title="Previous page (←)">
            «
          </button>
          <span id="pageNumbersBottom" class="page-numbers"></span>
          <button id="nextBtnBottom" class="nav-btn" title="Next page (→)">
            »
          </button>
          <button
            id="lastBtnBottom"
            class="nav-btn nav-edge"
            title="Last page (End)"
          >
            »»
          </button>
        </div>
        <div class="nav-counter-bottom" id="pageOfTotalBottom"></div>
      </nav>
    </div>

    <script type="module">
      import { initI18n, cycleLanguage } from "../js/i18n.js";
      initI18n();
      document.getElementById("btnLang").addEventListener("click", cycleLanguage);
    </script>

    <script>
      // Theme toggle
      document
        .getElementById("themeToggle")
        .addEventListener("click", function () {
          var html = document.documentElement;
          var next =
            html.getAttribute("data-theme") === "dark" ? "light" : "dark";
          html.setAttribute("data-theme", next);
          localStorage.setItem("theme", next);
        });

      // Widescreen toggle
      (function () {
        var btn = document.getElementById("btnWidescreen");
        function set(on) {
          var html = document.documentElement;
          if (on) {
            html.setAttribute("data-widescreen", "");
            btn.classList.add("active");
          } else {
            html.removeAttribute("data-widescreen");
            btn.classList.remove("active");
          }
        }
        if (localStorage.getItem("widescreen")) { set(true); }
        btn.addEventListener("click", function () {
          var on = !document.documentElement.hasAttribute("data-widescreen");
          set(on);
          if (on) localStorage.setItem("widescreen", "1");
          else localStorage.removeItem("widescreen");
        });
      })();

      // Sidebar toggle
      (function () {
        var sidebar = document.getElementById("sidebar");
        var overlay = document.getElementById("sidebarOverlay");
        var openBtn = document.getElementById("menuBtn");
        var closeBtn = document.getElementById("sidebarClose");

        function open() {
          sidebar.classList.add("open");
          overlay.classList.add("open");
        }
        function close() {
          sidebar.classList.remove("open");
          overlay.classList.remove("open");
        }
        openBtn.addEventListener("click", open);
        closeBtn.addEventListener("click", close);
        overlay.addEventListener("click", close);
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape") close();
        });
      })();
    </script>

    <script src="../dependencies/papaparse.min.js"></script>

    <script type="module" src="../js/reader.js"></script>
  </body>
</html>
