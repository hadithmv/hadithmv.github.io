name: Mirror to Codeberg

on:
  push:
    branches:
      - '**'
  delete:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror to Codeberg
        uses: cssnr/mirror-repository-action@v1
        with:
          host: codeberg.org
          username: hadithmv
          password: ${{ secrets.CODEBERG_TOKEN }}
          create: true
