name: Mirror to Codeberg

on:
  push:
    branches:
      - main
  delete:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, not just latest commit

      - name: Mirror to Codeberg
        uses: cssnr/mirror-repository-action@v1
        with:
          host: codeberg.org
          username: hadithmv
          password: ${{ secrets.CODEBERG_TOKEN }}
          create: true
