name: Mirror to Codeberg

on:
  push:
    branches: [ main, master, pages ]

jobs:
  codeberg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror to Codeberg
        run: |
          git remote add codeberg https://${{ secrets.CODEBERG_TOKEN }}@codeberg.org/hadithmv/hadithmv.git
          git push --force --prune codeberg refs/remotes/origin/*:refs/heads/*
